error_log  /var/www/log/error.log;
access_log /var/www/log/access.log;
access_log /var/www/log/traffic.jsonl argus_traffic if=$argus_log_traffic;

# Block paths containing '..' (Directory Traversal attempts)
set $blocked 0;
if ($request_uri ~* "\.\.") {
    set $blocked 1;
}

if ($blocked) {
    return 403;
}

# Internal observation contracts are reachable only on the Compose network.
location ^~ /api/v1/internal/ { return 404; }
location ^~ /internal/ { return 404; }

location /api/ {
    # Allow ten immediate attempts per client, then one every ten seconds.
    limit_req zone=argus_login burst=9 nodelay;
    limit_req_status 429;
    error_page 429 = @login_rate_limited;
    proxy_pass http://api:8000;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location @login_rate_limited {
    default_type application/json;
    add_header Retry-After 10 always;
    add_header Cache-Control "no-store" always;
    return 429 '{"success":false,"data":null,"error":{"code":"RATE_LIMITED","message":"Too many sign-in attempts. Try again in 10 seconds."}}';
}

location / {
    proxy_pass http://frontend:3000/;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /_next/static/ {
    proxy_pass http://frontend:3000/_next/static/;
    expires 1y;
    access_log off;
    add_header Cache-Control "public, immutable";
}

location = /favicon.ico {
    log_not_found off;
    access_log off;
}

location = /robots.txt {
    log_not_found off;
    access_log off;
    allow all;
}
