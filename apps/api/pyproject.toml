[project]
name = "argus-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "PyJWT>=2",
  "pandas>=2.2,<3",
  "numpy>=1.26",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "forecast",
  "forecast-core>=0.2.0",
  "common",
  "clio",
  "sentry-sdk>=2.61.1",
  "pydantic>=2.13.4",
  "pydantic-settings>=2.14.1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
]

[tool.uv.sources]
common = { workspace = true }
clio = { workspace = true, editable = true }
forecast-core = { path = "../../packages/forecast-core", editable = true }
forecast = { workspace = true, editable = true }

[tool.uv.workspace]
members = [
    "../../packages/common",
    "../../packages/clio",
    "../../packages/forecast",
]
