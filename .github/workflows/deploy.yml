name: Application Deploy

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      rebuild:
        description: Rebuild all images even when source identities are cached (base image updates)
        type: boolean
        default: false

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      private_commit: ${{ steps.plan.outputs.private_commit }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/workflows/deploy.yml
      - name: Validate architecture and deployment planning
        run: |
          python3 -m pip install pytest pyyaml
          python3 -m pytest -q tests/test_architecture.py tests/test_domain_deployment.py tests/test_release_deployment.py tests/test_argus_cli.py tests/test_argus_entrypoint.py
      - name: Resolve the private backend once for this release
        uses: actions/checkout@v6
        with:
          repository: a-kryvenko/argus-forecast-core
          ref: master
          path: packages/forecast-core
          ssh-key: ${{ secrets.FORECAST_CORE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Compute image identities and migration fingerprints
        id: plan
        env:
          REBUILD_NONCE: ${{ inputs.rebuild && format('{0}-{1}', github.run_id, github.run_attempt) || '' }}
        run: |
          python3 scripts/deployment/release.py plan --rebuild "$REBUILD_NONCE" --output release-plan.json
          python3 - <<'PY'
          import json, os
          plan = json.load(open('release-plan.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('private_commit=' + plan['private_commit'] + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: release-plan
          path: release-plan.json

  images:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [frontend, api, clio, prophet, intelligence]
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: release-plan
      - name: Read this component's build identity
        id: identity
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          python3 - <<'PY'
          import json, os
          spec = json.load(open('release-plan.json'))['components'][os.environ['COMPONENT']]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key, value in spec.items():
                  output.write(key + '=' + value + '\n')
          PY
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reuse an existing image with the same inputs
        id: cache
        env:
          IMAGE: ${{ steps.identity.outputs.repository }}:${{ steps.identity.outputs.tag }}
        run: |
          if docker buildx imagetools inspect "$IMAGE" --format '{{.Manifest.Digest}}' > image-digest.txt 2> image-inspect-error.txt; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Check out the exact private backend used by the plan
        if: steps.cache.outputs.exists != 'true' && (matrix.component == 'clio' || matrix.component == 'prophet')
        uses: actions/checkout@v6
        with:
          repository: a-kryvenko/argus-forecast-core
          ref: ${{ needs.plan.outputs.private_commit }}
          path: packages/forecast-core
          ssh-key: ${{ secrets.FORECAST_CORE_DEPLOY_KEY }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
        if: steps.cache.outputs.exists != 'true'
      - name: Build changed component
        if: steps.cache.outputs.exists != 'true'
        id: build
        uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671
        with:
          context: .
          file: .deploy/${{ matrix.component }}.Dockerfile
          push: true
          tags: ${{ steps.identity.outputs.repository }}:${{ steps.identity.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.component }}
          # Avoid exporting large intermediate frontend builder layers.
          cache-to: type=gha,mode=${{ matrix.component == 'frontend' && 'min' || 'max' }},scope=${{ matrix.component }}
      - name: Attest newly built image
        if: steps.cache.outputs.exists != 'true'
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.identity.outputs.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Pin the resulting image digest
        env:
          COMPONENT: ${{ matrix.component }}
          IMAGE: ${{ steps.identity.outputs.repository }}
          TAG: ${{ steps.identity.outputs.tag }}
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [[ -n "$BUILT_DIGEST" ]]; then
            printf '%s\n' "$BUILT_DIGEST" > image-digest.txt
          fi
          python3 - <<'PY'
          import json, os, re
          digest = open('image-digest.txt').read().strip()
          if not re.fullmatch(r'sha256:[0-9a-f]{64}', digest):
              raise SystemExit('Invalid registry digest')
          with open(os.environ['COMPONENT'] + '.json', 'w') as output:
              json.dump({'tag': os.environ['TAG'], 'image': os.environ['IMAGE'] + '@' + digest}, output)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.component }}
          path: ${{ matrix.component }}.json

  deploy:
    needs: [plan, images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: release-plan
      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          merge-multiple: true
          path: image-results
      - name: Assemble the release bundle
        run: python3 scripts/deployment/release.py bundle --plan release-plan.json --images image-results --output release-bundle
      - name: Upload to a unique staging directory
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          source: release-bundle
          target: /var/www/incoming/${{ github.run_id }}-${{ github.run_attempt }}
      - name: Apply the release
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          RELEASE_DIRECTORY: /var/www/incoming/${{ github.run_id }}-${{ github.run_attempt }}/release-bundle
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          envs: GHCR_USERNAME,GHCR_READ_TOKEN,RELEASE_DIRECTORY
          command_timeout: 30m
          script: |
            set -eu
            printf '%s' "$GHCR_READ_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
            bash "$RELEASE_DIRECTORY/deploy.sh" /var/www
