x-clio-runtime: &clio-runtime
  image: ${ARGUS_CLIO_IMAGE:-andriykryvenko/argus-clio:latest}
  restart: unless-stopped
  init: true
  stop_grace_period: 10m
  environment:
    ARGUS_WORKDIR: /var/www
    DEBUG: ${DEBUG:-false}
    CLIO_DB_HOST: ${CLIO_DB_HOST:-postgres}
    CLIO_DB_PORT: ${CLIO_DB_PORT:-5432}
    CLIO_DB_NAME: ${CLIO_DB_NAME:?CLIO_DB_NAME is required}
    CLIO_DB_USER: ${CLIO_DB_USER:?CLIO_DB_USER is required}
    CLIO_DB_PASSWORD: ${CLIO_DB_PASSWORD:?CLIO_DB_PASSWORD is required}
    OBSERVATIONS_SERVICE_TOKEN: ${OBSERVATIONS_SERVICE_TOKEN:?OBSERVATIONS_SERVICE_TOKEN is required}
    SENTRY_COLLECT_POINT: ${SENTRY_COLLECT_POINT:-}
  volumes:
    - ./configs:/var/www/configs:ro
    - ./data:/var/www/data
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    backend:

services:
  intelligence:
    image: ${ARGUS_INTELLIGENCE_IMAGE:-andriykryvenko/argus-intelligence:latest}
    restart: unless-stopped
    init: true
    stop_grace_period: 2m
    command: ["intelligence", "worker"]
    environment:
      INTELLIGENCE_DB_HOST: ${INTELLIGENCE_DB_HOST:-postgres}
      INTELLIGENCE_DB_PORT: ${INTELLIGENCE_DB_PORT:-5432}
      INTELLIGENCE_DB_NAME: ${INTELLIGENCE_DB_NAME:?INTELLIGENCE_DB_NAME is required}
      INTELLIGENCE_DB_USER: ${INTELLIGENCE_DB_USER:?INTELLIGENCE_DB_USER is required}
      INTELLIGENCE_DB_PASSWORD: ${INTELLIGENCE_DB_PASSWORD:?INTELLIGENCE_DB_PASSWORD is required}
      FORECASTS_URL: http://prophet-api:8000
      FORECASTS_SERVICE_TOKEN: ${FORECASTS_SERVICE_TOKEN:?FORECASTS_SERVICE_TOKEN is required}
    depends_on:
      postgres:
        condition: service_healthy
      prophet-api:
        condition: service_healthy
    networks: [backend, forecasts]

  intelligence-migrate:
    image: ${ARGUS_INTELLIGENCE_IMAGE:-andriykryvenko/argus-intelligence:latest}
    profiles: ["maintenance"]
    command: ["intelligence", "migrate", "upgrade", "head"]
    environment:
      INTELLIGENCE_DB_HOST: ${INTELLIGENCE_DB_HOST:-postgres}
      INTELLIGENCE_DB_PORT: ${INTELLIGENCE_DB_PORT:-5432}
      INTELLIGENCE_DB_NAME: ${INTELLIGENCE_DB_NAME:?INTELLIGENCE_DB_NAME is required}
      INTELLIGENCE_DB_USER: ${INTELLIGENCE_DB_USER:?INTELLIGENCE_DB_USER is required}
      INTELLIGENCE_DB_PASSWORD: ${INTELLIGENCE_DB_PASSWORD:?INTELLIGENCE_DB_PASSWORD is required}
    networks: [backend]

  api:
    image: ${ARGUS_API_IMAGE:-andriykryvenko/argus-forecast:latest}
    container_name: argusForecast
    restart: unless-stopped
    tty: true
    environment:
      ARGUS_WORKDIR: /var/www
      DEBUG: ${DEBUG:-false}
      API_DB_HOST: ${API_DB_HOST:-postgres}
      API_DB_PORT: ${API_DB_PORT:-5432}
      API_DB_NAME: ${API_DB_NAME:?API_DB_NAME is required}
      API_DB_USER: ${API_DB_USER:?API_DB_USER is required}
      API_DB_PASSWORD: ${API_DB_PASSWORD:?API_DB_PASSWORD is required}
      SENTRY_COLLECT_POINT: ${SENTRY_COLLECT_POINT:-}
      FORECASTS_URL: http://prophet-api:8000
      FORECASTS_SERVICE_TOKEN: ${FORECASTS_SERVICE_TOKEN:?FORECASTS_SERVICE_TOKEN is required}
      OBSERVATIONS_URL: http://clio:8000
      OBSERVATIONS_SERVICE_TOKEN: ${OBSERVATIONS_SERVICE_TOKEN:?OBSERVATIONS_SERVICE_TOKEN is required}
      DASHBOARD_ORIGINS: ${DASHBOARD_ORIGINS-https://${APP_NAME:?APP_NAME is required}}
      DASHBOARD_COOKIE_SECURE: ${DASHBOARD_COOKIE_SECURE:-true}
    expose:
      - "8000"
    volumes:
      - ./configs:/var/www/configs:ro
      - ./data:/var/www/data
      - ./log/api:/var/www/log
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      prophet-api:
        condition: service_healthy
    networks:
      application:
      backend:
      observations:
      forecasts:

  clio:
    <<: *clio-runtime
    command: ["clio", "serve"]
    expose: ["8000"]
    networks:
      backend:
      observations:
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  solar-wind:
    <<: *clio-runtime
    command: ["clio", "collect", "solar-wind", "--watch"]
    healthcheck:
      test: ["CMD", "clio", "check-health", "solar-wind"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

  geomagnetic:
    <<: *clio-runtime
    command: ["clio", "collect", "geomagnetic", "--watch"]
    healthcheck:
      test: ["CMD", "clio", "check-health", "geomagnetic"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

  clio-refresh:
    <<: *clio-runtime
    command: ["clio", "schedule", "refresh"]

  clio-aggregate:
    <<: *clio-runtime
    command: ["clio", "schedule", "aggregate"]

  db-provision:
    image: ${ARGUS_API_IMAGE:-andriykryvenko/argus-forecast:latest}
    profiles: ["maintenance"]
    command: [".venv/bin/python", "/var/www/scripts/db/provision.py", "--apply"]
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:?DB_NAME is required}
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      API_DB_HOST: ${API_DB_HOST:-postgres}
      API_DB_PORT: ${API_DB_PORT:-5432}
      API_DB_NAME: ${API_DB_NAME:?API_DB_NAME is required}
      API_DB_USER: ${API_DB_USER:?API_DB_USER is required}
      API_DB_PASSWORD: ${API_DB_PASSWORD:?API_DB_PASSWORD is required}
      CLIO_DB_HOST: ${CLIO_DB_HOST:-postgres}
      CLIO_DB_PORT: ${CLIO_DB_PORT:-5432}
      CLIO_DB_NAME: ${CLIO_DB_NAME:?CLIO_DB_NAME is required}
      CLIO_DB_USER: ${CLIO_DB_USER:?CLIO_DB_USER is required}
      CLIO_DB_PASSWORD: ${CLIO_DB_PASSWORD:?CLIO_DB_PASSWORD is required}
      PROPHET_DB_HOST: ${PROPHET_DB_HOST:-postgres}
      PROPHET_DB_PORT: ${PROPHET_DB_PORT:-5432}
      PROPHET_DB_NAME: ${PROPHET_DB_NAME:?PROPHET_DB_NAME is required}
      PROPHET_DB_USER: ${PROPHET_DB_USER:?PROPHET_DB_USER is required}
      PROPHET_DB_PASSWORD: ${PROPHET_DB_PASSWORD:?PROPHET_DB_PASSWORD is required}
      INTELLIGENCE_DB_HOST: ${INTELLIGENCE_DB_HOST:-postgres}
      INTELLIGENCE_DB_PORT: ${INTELLIGENCE_DB_PORT:-5432}
      INTELLIGENCE_DB_NAME: ${INTELLIGENCE_DB_NAME:?INTELLIGENCE_DB_NAME is required}
      INTELLIGENCE_DB_USER: ${INTELLIGENCE_DB_USER:?INTELLIGENCE_DB_USER is required}
      INTELLIGENCE_DB_PASSWORD: ${INTELLIGENCE_DB_PASSWORD:?INTELLIGENCE_DB_PASSWORD is required}
    networks: [backend]

  api-migrate:
    image: ${ARGUS_API_IMAGE:-andriykryvenko/argus-forecast:latest}
    profiles: ["maintenance"]
    command: [".venv/bin/alembic", "upgrade", "head"]
    environment:
      API_DB_HOST: ${API_DB_HOST:-postgres}
      API_DB_PORT: ${API_DB_PORT:-5432}
      API_DB_NAME: ${API_DB_NAME:?API_DB_NAME is required}
      API_DB_USER: ${API_DB_USER:?API_DB_USER is required}
      API_DB_PASSWORD: ${API_DB_PASSWORD:?API_DB_PASSWORD is required}
    networks: [backend]

  clio-migrate:
    image: ${ARGUS_CLIO_IMAGE:-andriykryvenko/argus-clio:latest}
    profiles: ["maintenance"]
    command: ["clio", "migrate", "upgrade", "head"]
    environment:
      ARGUS_WORKDIR: /var/www
      CLIO_DB_HOST: ${CLIO_DB_HOST:-postgres}
      CLIO_DB_PORT: ${CLIO_DB_PORT:-5432}
      CLIO_DB_NAME: ${CLIO_DB_NAME:?CLIO_DB_NAME is required}
      CLIO_DB_USER: ${CLIO_DB_USER:?CLIO_DB_USER is required}
      CLIO_DB_PASSWORD: ${CLIO_DB_PASSWORD:?CLIO_DB_PASSWORD is required}
    volumes:
      - ./configs:/var/www/configs:ro
    networks: [backend]

  prophet-migrate:
    image: ${ARGUS_PROPHET_IMAGE:-andriykryvenko/argus-prophet:latest}
    profiles: ["maintenance"]
    command: ["prophet", "migrate", "upgrade", "head"]
    environment:
      ARGUS_WORKDIR: /var/www
      PROPHET_DB_HOST: ${PROPHET_DB_HOST:-postgres}
      PROPHET_DB_PORT: ${PROPHET_DB_PORT:-5432}
      PROPHET_DB_NAME: ${PROPHET_DB_NAME:?PROPHET_DB_NAME is required}
      PROPHET_DB_USER: ${PROPHET_DB_USER:?PROPHET_DB_USER is required}
      PROPHET_DB_PASSWORD: ${PROPHET_DB_PASSWORD:?PROPHET_DB_PASSWORD is required}
    volumes:
      - ./configs:/var/www/configs:ro
    networks: [backend]

  prophet:
    image: ${ARGUS_PROPHET_IMAGE:-andriykryvenko/argus-prophet:latest}
    restart: unless-stopped
    init: true
    command: ["prophet", "worker"]
    stop_grace_period: 10m
    environment:
      ARGUS_WORKDIR: /var/www
      PROPHET_DB_HOST: ${PROPHET_DB_HOST:-postgres}
      PROPHET_DB_PORT: ${PROPHET_DB_PORT:-5432}
      PROPHET_DB_NAME: ${PROPHET_DB_NAME:?PROPHET_DB_NAME is required}
      PROPHET_DB_USER: ${PROPHET_DB_USER:?PROPHET_DB_USER is required}
      PROPHET_DB_PASSWORD: ${PROPHET_DB_PASSWORD:?PROPHET_DB_PASSWORD is required}
      OBSERVATIONS_URL: http://clio:8000
      OBSERVATIONS_SERVICE_TOKEN: ${OBSERVATIONS_SERVICE_TOKEN:?OBSERVATIONS_SERVICE_TOKEN is required}
      SENTRY_COLLECT_POINT: ${SENTRY_COLLECT_POINT:-}
    volumes:
      - ./configs:/var/www/configs:ro
      - ./data:/var/www/data
    depends_on:
      clio:
        condition: service_healthy
    networks:
      backend:
      observations:

  prophet-api:
    image: ${ARGUS_PROPHET_IMAGE:-andriykryvenko/argus-prophet:latest}
    restart: unless-stopped
    init: true
    command: ["prophet", "serve"]
    environment:
      ARGUS_WORKDIR: /var/www
      PROPHET_DB_HOST: ${PROPHET_DB_HOST:-postgres}
      PROPHET_DB_PORT: ${PROPHET_DB_PORT:-5432}
      PROPHET_DB_NAME: ${PROPHET_DB_NAME:?PROPHET_DB_NAME is required}
      PROPHET_DB_USER: ${PROPHET_DB_USER:?PROPHET_DB_USER is required}
      PROPHET_DB_PASSWORD: ${PROPHET_DB_PASSWORD:?PROPHET_DB_PASSWORD is required}
      FORECASTS_SERVICE_TOKEN: ${FORECASTS_SERVICE_TOKEN:?FORECASTS_SERVICE_TOKEN is required}
    volumes:
      - ./configs:/var/www/configs:ro
    expose: ["8000"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend, forecasts]
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=15)"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s

  frontend:
    image: ${ARGUS_FRONTEND_IMAGE:-andriykryvenko/argus-frontend:latest}
    container_name: argusFrontend
    restart: unless-stopped
    tty: true
    expose:
      - "3000"
    volumes:
      - ./log/frontend:/var/www/log
    depends_on:
      - api
    networks:
      application:

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      backend:
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      backend:
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:stable-alpine
    container_name: argusNginx
    restart: unless-stopped
    tty: true
    expose:
      - "80"
    volumes:
      - ./log/nginx:/var/www/log
      - ./nginx/default.conf:/etc/nginx/includes/default.conf
      - ./nginx/templates/http.conf.template:/etc/nginx/templates/website.conf.template
    environment:
      - HOSTNAME=${APP_NAME}
      - APP_NAME=${APP_NAME}
      - VIRTUAL_HOST=${APP_NAME}
      - LETSENCRYPT_HOST=${APP_NAME}
    depends_on:
      - frontend
      - api
    networks:
      nginx-proxy-network:
      frontserver:
      application:
          aliases:
            - ${APP_NAME}
  
  alloy:
    image: grafana/alloy:latest
    container_name: argusAlloy
    restart: unless-stopped
    tty: true
    environment:
      - LOKI_MONITORING_ENDPOINT=${LOKI_MONITORING_ENDPOINT}
      - PROMETHEUS_MONITORING_ENDPOINT=${PROMETHEUS_MONITORING_ENDPOINT}
      - MONITORING_AUTH_USER=${MONITORING_AUTH_USER}
      - MONITORING_AUTH_PASSWORD=${MONITORING_AUTH_PASSWORD}
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro

       # Host metrics
      - /:/host/root:ro,rslave
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro

      # Logs
      - ./log/nginx:/var/log/nginx:ro

    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
    
    depends_on:
      - nginx

volumes:
  postgres_data:
  redis_data:

networks:
  nginx-proxy-network:
    external: true
  frontserver:
    driver: bridge
  application:
    driver: bridge
  backend:
    driver: bridge
  observations:
    driver: bridge
  forecasts:
    driver: bridge
