[project]
name = "clio"
version = "0.1.0"
description = "Part of Argus Sunwatch designed for getting historical solar observations data"
requires-python = ">=3.11"
dependencies = [
    "common",
    "beautifulsoup4>=4.15.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "cdflib>=1.1.0",
    "requests>=2.32",
    "xarray>=2026.4.0",
    "h5netcdf>=1.8.1",
    "h5py>=3.16.0",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.uv.sources]
common = { workspace = true }
