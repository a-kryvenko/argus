# Production overrides; merged with ../docker-compose.yml by release tooling.

x-clio-runtime: &clio-runtime
  restart: unless-stopped
  environment:
    DATA_STORAGE: s3
    S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
    S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
    S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    S3_REGION: ${S3_REGION:-auto}
  healthcheck: &clio-healthcheck
    start_interval: 1s

x-prophet-runtime: &prophet-runtime
  environment: &prophet-environment
    OBSERVATIONS_URL: http://observations-router:8101

x-intelligence-runtime: &intelligence-runtime
  restart: unless-stopped
  environment: &intelligence-environment
    FORECASTS_URL: http://forecasts-router:8102

x-api-runtime: &api-runtime
  environment: &api-environment
    FORECASTS_URL: http://forecasts-router:8102
    OBSERVATIONS_URL: http://observations-router:8101

services:
  clio:
    <<: *clio-runtime
    networks:
      backend:
      observations:
    expose:
      - '8000'

  clio-migrate:
    image: ${ARGUS_CLIO_IMAGE:-ghcr.io/a-kryvenko/argus-clio:latest}
    profiles: [maintenance]
    command: [alembic, upgrade, head]
    environment:
      CLIO_DB_HOST: ${CLIO_DB_HOST:-postgres}
      CLIO_DB_PORT: ${CLIO_DB_PORT:-5432}
      CLIO_DB_NAME: ${CLIO_DB_NAME:?CLIO_DB_NAME is required}
      CLIO_DB_USER: ${CLIO_DB_USER:?CLIO_DB_USER is required}
      CLIO_DB_PASSWORD: ${CLIO_DB_PASSWORD:?CLIO_DB_PASSWORD is required}
      ARGUS_WORKDIR: /var/www
    volumes:
      - ./configs:/var/www/configs:ro
      - ./data/observations:/var/www/data/observations
    networks: [backend]

  prophet:
    <<: *prophet-runtime
    environment:
      <<: *prophet-environment
      FORECASTS_SERVICE_TOKEN: ${FORECASTS_SERVICE_TOKEN:?FORECASTS_SERVICE_TOKEN is required}
    networks:
      backend:
      observations:

  prophet-api:
    <<: *prophet-runtime
    environment:
      <<: *prophet-environment
      OBSERVATIONS_SERVICE_TOKEN: ${OBSERVATIONS_SERVICE_TOKEN:?OBSERVATIONS_SERVICE_TOKEN is required}
      SENTRY_COLLECT_POINT: ${SENTRY_COLLECT_POINT:-}
    restart: unless-stopped
    expose:
      - '8000'
    networks: [backend, forecasts]
    healthcheck:
      start_interval: 1s

  prophet-migrate:
    image: ${ARGUS_PROPHET_IMAGE:-ghcr.io/a-kryvenko/argus-prophet:latest}
    profiles: [maintenance]
    command: [alembic, upgrade, head]
    environment:
      PROPHET_DB_HOST: ${PROPHET_DB_HOST:-postgres}
      PROPHET_DB_PORT: ${PROPHET_DB_PORT:-5432}
      PROPHET_DB_NAME: ${PROPHET_DB_NAME:?PROPHET_DB_NAME is required}
      PROPHET_DB_USER: ${PROPHET_DB_USER:?PROPHET_DB_USER is required}
      PROPHET_DB_PASSWORD: ${PROPHET_DB_PASSWORD:?PROPHET_DB_PASSWORD is required}
      ARGUS_WORKDIR: /var/www
    volumes:
      - ./configs:/var/www/configs:ro
    networks: [backend]

  proswin:
    environment:
      OBSERVATIONS_URL: http://observations-router:8101
      OBSERVATIONS_SERVICE_TOKEN: ${OBSERVATIONS_SERVICE_TOKEN:?OBSERVATIONS_SERVICE_TOKEN is required}
    networks: [observations]

  intelligence:
    <<: *intelligence-runtime
    environment:
      <<: *intelligence-environment
      INTELLIGENCE_SERVICE_TOKEN: ${INTELLIGENCE_SERVICE_TOKEN:?INTELLIGENCE_SERVICE_TOKEN is required}
    networks: [backend, forecasts]

  intelligence-api:
    <<: *intelligence-runtime
    environment:
      <<: *intelligence-environment
      INTELLIGENCE_EXPERIMENTAL_DRAG_MONITOR: ${INTELLIGENCE_EXPERIMENTAL_DRAG_MONITOR:-false}
    networks: [backend, forecasts, impacts]
    healthcheck:
      start_interval: 1s

  intelligence-migrate:
    image: ${ARGUS_INTELLIGENCE_IMAGE:-ghcr.io/a-kryvenko/argus-intelligence:latest}
    profiles: [maintenance]
    command: [alembic, upgrade, head]
    environment:
      INTELLIGENCE_DB_HOST: ${INTELLIGENCE_DB_HOST:-postgres}
      INTELLIGENCE_DB_PORT: ${INTELLIGENCE_DB_PORT:-5432}
      INTELLIGENCE_DB_NAME: ${INTELLIGENCE_DB_NAME:?INTELLIGENCE_DB_NAME is required}
      INTELLIGENCE_DB_USER: ${INTELLIGENCE_DB_USER:?INTELLIGENCE_DB_USER is required}
      INTELLIGENCE_DB_PASSWORD: ${INTELLIGENCE_DB_PASSWORD:?INTELLIGENCE_DB_PASSWORD is required}
    networks: [backend]

  api:
    <<: *api-runtime
    environment:
      <<: *api-environment
      INTELLIGENCE_URL: http://impacts-router:8103
      DASHBOARD_ORIGINS: ${DASHBOARD_ORIGINS-https://${APP_NAME:?APP_NAME is required}}
      DASHBOARD_COOKIE_SECURE: ${DASHBOARD_COOKIE_SECURE:-true}
      DEPLOY_SMOKE_USERNAME: ${DEPLOY_SMOKE_USERNAME:-}
      DEPLOY_SMOKE_PASSWORD: ${DEPLOY_SMOKE_PASSWORD:-}
      DEPLOY_MIN_AVAILABLE_MIB: ${DEPLOY_MIN_AVAILABLE_MIB:-1024}
    container_name: argusForecast
    restart: unless-stopped
    tty: true
    expose:
      - '8000'
    volumes:
      - ./log/api:/var/www/log
    networks:
      application:
      backend:
      observations:
      forecasts:
      impacts:
    healthcheck:
      retries: 3
      start_interval: 1s
    stop_grace_period: 60s

  api-migrate:
    image: ${ARGUS_API_IMAGE:-ghcr.io/a-kryvenko/argus-forecast:latest}
    profiles: [maintenance]
    command: [alembic, upgrade, head]
    environment:
      API_DB_HOST: ${API_DB_HOST:-postgres}
      API_DB_PORT: ${API_DB_PORT:-5432}
      API_DB_NAME: ${API_DB_NAME:?API_DB_NAME is required}
      API_DB_USER: ${API_DB_USER:?API_DB_USER is required}
      API_DB_PASSWORD: ${API_DB_PASSWORD:?API_DB_PASSWORD is required}
    networks: [backend]

  db-provision:
    networks: [backend]

  frontend:
    image: ${ARGUS_FRONTEND_IMAGE:-ghcr.io/a-kryvenko/argus-frontend:latest}
    container_name: argusFrontend
    restart: unless-stopped
    tty: true
    expose:
      - '3000'
    environment:
      DEMO_BUNDLE_PATH: /var/www/demo/current.json
    volumes:
      - ./log/frontend:/var/www/log
      - ./data/demo:/var/www/demo:ro
    depends_on:
      - api
    networks:
      application:
    healthcheck:
      test: [CMD, node, -e, 'fetch(''http://127.0.0.1:3000/'').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
      start_interval: 1s
    stop_grace_period: 60s

  postgres:
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    networks:
      backend:

  redis:
    networks:
      backend:

  nginx:
    image: nginx:stable-alpine
    container_name: argusNginx
    restart: unless-stopped
    tty: true
    expose:
      - '80'
    volumes:
      - ./log/nginx:/var/www/log
      - ./nginx/default.conf:/etc/nginx/includes/default.conf
      - ./nginx/templates/http.conf.template:/etc/nginx/templates/website.conf.template
      - ./data/next-static:/var/www/next-static:ro
    environment:
      - HOSTNAME=${APP_NAME}
      - APP_NAME=${APP_NAME}
      - VIRTUAL_HOST=${APP_NAME}
      - LETSENCRYPT_HOST=${APP_NAME}
    depends_on:
      - frontend
      - api
    networks:
      nginx-proxy-network:
      frontserver:
      application:
        aliases:
          - ${APP_NAME}

  alloy:
    image: grafana/alloy:latest
    container_name: argusAlloy
    restart: unless-stopped
    tty: true
    environment:
      - LOKI_MONITORING_ENDPOINT=${LOKI_MONITORING_ENDPOINT}
      - PROMETHEUS_MONITORING_ENDPOINT=${PROMETHEUS_MONITORING_ENDPOINT}
      - MONITORING_AUTH_USER=${MONITORING_AUTH_USER}
      - MONITORING_AUTH_PASSWORD=${MONITORING_AUTH_PASSWORD}
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /:/host/root:ro,rslave
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - ./log/nginx:/var/log/nginx:ro
    command: [run, /etc/alloy/config.alloy, '--server.http.listen-addr=0.0.0.0:12345']
    depends_on:
      - nginx

  clio-worker:
    <<: *clio-runtime
    networks:
      backend:

networks:
  nginx-proxy-network:
    external: true
  frontserver:
    driver: bridge
  application:
    driver: bridge
  backend:
    driver: bridge
  observations:
    driver: bridge
  forecasts:
    driver: bridge
  impacts:
    driver: bridge
