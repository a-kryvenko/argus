<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10161d">
  <title>Maintenance — Argus SunWatch</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #10161d;
      color: #e6edf3;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: flex; flex-direction: column; }
    header, main, footer { width: min(1120px, calc(100% - 96px)); margin-inline: auto; }
    header { padding-top: 40px; }
    .brand { display: inline-flex; align-items: center; gap: 12px; }
    .brand svg { width: 32px; height: 32px; color: #f4b66a; }
    .brand-name { display: block; font-size: 19px; font-weight: 650; letter-spacing: .15em; }
    .brand-caption { display: block; margin-top: 3px; color: #91a2b2; font-size: 9px; letter-spacing: .28em; }
    main { flex: 1; display: grid; grid-template-columns: 1.05fr 1fr; align-items: center; gap: 32px; padding-block: 64px; }
    .status { display: flex; align-items: center; gap: 10px; color: #f4b66a; font: 11px/1.5 ui-monospace, monospace; letter-spacing: .13em; text-transform: uppercase; }
    .status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; box-shadow: 0 0 0 5px #f4b66a0d; }
    h1 { margin: 26px 0 22px; max-width: 540px; font-size: clamp(44px, 5.4vw, 70px); line-height: 1.06; font-weight: 500; letter-spacing: -.055em; text-wrap: balance; }
    .description { max-width: 370px; margin: 0; color: #a3b1bf; font-size: 16px; line-height: 1.8; }
    .retry { display: inline-flex; align-items: center; justify-content: center; gap: 24px; min-height: 48px; margin-top: 32px; padding: 0 22px; border: 1px solid #f4b66a; border-radius: 5px; background: #f4b66a; color: #10161d; font-size: 14px; font-weight: 600; text-decoration: none; transition: background .15s, border-color .15s; }
    .retry:hover { background: #ffd09a; border-color: #ffd09a; }
    .retry:focus-visible { outline: 2px solid #e6edf3; outline-offset: 5px; }
    .retry svg { width: 16px; height: 16px; }
    .illustration { width: 100%; max-width: 500px; justify-self: end; }
    .illustration svg { display: block; width: 100%; height: auto; }
    footer { display: flex; justify-content: space-between; gap: 16px; padding: 22px 0 28px; border-top: 1px solid #26313c; color: #91a2b2; font: 10px/1.6 ui-monospace, monospace; letter-spacing: .025em; }
    .footer-status { display: flex; align-items: center; gap: 8px; }
    .footer-status::before { content: ""; width: 5px; height: 5px; border: 1px solid #f4b66a; border-radius: 50%; }
    @media (max-width: 700px) {
      header, main, footer { width: calc(100% - 48px); }
      header { padding-top: 28px; }
      main { grid-template-columns: 1fr; gap: 12px; padding-block: 24px 48px; }
      .illustration { grid-row: 1; justify-self: center; max-width: 280px; }
      .content { text-align: center; }
      .status { justify-content: center; font-size: 10px; }
      h1 { margin: 20px auto 18px; font-size: clamp(42px, 10vw, 56px); }
      .description { margin-inline: auto; font-size: 15px; }
      .retry { margin-top: 26px; }
      footer { flex-wrap: wrap; justify-content: center; padding-block: 20px; text-align: center; }
    }
    @media (prefers-reduced-motion: reduce) { .retry { transition: none; } }
  </style>
</head>
<body>
  <header>
    <div class="brand" aria-label="Argus SunWatch">
      <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <circle cx="16" cy="16" r="6" stroke="currentColor" stroke-width="1.5"/>
        <path d="M16 2v5m0 18v5M2 16h5m18 0h5M6.1 6.1l3.5 3.5m12.8 12.8 3.5 3.5M6.1 25.9l3.5-3.5M22.4 9.6l3.5-3.5" stroke="currentColor" stroke-width="1.5"/>
      </svg>
      <span><span class="brand-name">ARGUS</span><span class="brand-caption">SUNWATCH</span></span>
    </div>
  </header>

  <main>
    <section class="content" aria-labelledby="title">
      <div class="status">Scheduled maintenance</div>
      <h1 id="title">We'll be back soon.</h1>
      <p class="description">We're making a few updates to Argus SunWatch. Observations and forecasts will be available again once maintenance is complete.</p>
      <a class="retry" href="/">
        Try again
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M4 10h12m-5-5 5 5-5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
    </section>

    <div class="illustration" aria-hidden="true">
      <svg viewBox="0 0 520 520" fill="none">
        <defs>
          <radialGradient id="halo"><stop stop-color="#e89c46" stop-opacity=".14"/><stop offset="1" stop-color="#e89c46" stop-opacity="0"/></radialGradient>
          <radialGradient id="sun" cx=".34" cy=".29" r=".78"><stop stop-color="#ffdda2"/><stop offset=".48" stop-color="#f4b66a"/><stop offset="1" stop-color="#b9642d"/></radialGradient>
          <clipPath id="surface"><circle cx="260" cy="260" r="83"/></clipPath>
        </defs>
        <circle cx="260" cy="260" r="248" fill="url(#halo)"/>
        <g stroke="#718397" stroke-opacity=".19">
          <circle cx="260" cy="260" r="232"/>
          <circle cx="260" cy="260" r="184"/>
          <circle cx="260" cy="260" r="136"/>
          <path d="M260 16v112m0 264v112M16 260h112m264 0h112"/>
          <path d="M96 96l8 8m312 312 8 8M96 424l8-8m312-312 8-8"/>
        </g>
        <circle cx="260" cy="260" r="108" stroke="#f4b66a" stroke-opacity=".28" stroke-dasharray="1 7"/>
        <path d="M260 28a232 232 0 0 1 222 165" stroke="#f4b66a" stroke-opacity=".5" stroke-linecap="round"/>
        <circle cx="482" cy="193" r="4" fill="#f4b66a"/>
        <circle cx="482" cy="193" r="9" stroke="#f4b66a" stroke-opacity=".18"/>
        <circle cx="130" cy="390" r="3" fill="#91a2b2"/>
        <circle cx="260" cy="260" r="83" fill="url(#sun)"/>
        <g clip-path="url(#surface)" stroke="#ffe3b4" stroke-opacity=".2">
          <path d="M154 224c40-40 75-32 90-8s-2 45 26 59 64-6 91 29"/>
          <path d="M159 244c34-35 57-29 67-8s-2 43 30 58 75 5 105 39"/>
          <path d="M182 168c8 33 29 39 56 24s36-11 49 15 41 34 72 17"/>
          <path d="M199 162c10 23 22 27 42 15s48-6 63 24 35 17 56 6"/>
          <path d="M166 293c38-17 43-7 56 16s32 39 67 29 50-2 65 15"/>
        </g>
        <circle cx="260" cy="260" r="83" stroke="#ffdda2" stroke-opacity=".35"/>
        <g stroke="#91a2b2" stroke-opacity=".5">
          <path d="M255 28h10m-5-5v10M255 492h10m-5-5v10M23 260h10m-5-5v10M487 260h10m-5-5v10"/>
        </g>
      </svg>
    </div>
  </main>

  <footer>
    <span>Space weather observations &amp; forecasts</span>
    <span class="footer-status">Temporarily unavailable</span>
  </footer>
</body>
</html>
