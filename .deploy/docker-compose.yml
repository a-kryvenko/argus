services:
  api:
    image: andriykryvenko/argus-forecast:latest
    container_name: argusForecast
    restart: unless-stopped
    tty: true
    env_file:
      - .env
      - .env.local
    environment:
      DB_HOST: postgres
    expose:
      - "8000"
    volumes:
      - ./configs:/var/www/configs:ro
      - ./data:/var/www/data
      - ./log/api:/var/www/log
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      application:
      backend:

  frontend:
    image: andriykryvenko/argus-frontend:latest
    container_name: argusFrontend
    restart: unless-stopped
    tty: true
    expose:
      - "3000"
    volumes:
      - ./log/frontend:/var/www/log
    depends_on:
      - api
    networks:
      application:

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      backend:
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      backend:
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:stable-alpine
    container_name: argusNginx
    restart: unless-stopped
    tty: true
    expose:
      - "80"
    volumes:
      - ./log/nginx:/var/www/log
      - ./nginx/default.conf:/etc/nginx/includes/default.conf
      - ./nginx/templates/http.conf.template:/etc/nginx/templates/website.conf.template
    environment:
      - HOSTNAME=${APP_NAME}
      - APP_NAME=${APP_NAME}
      - VIRTUAL_HOST=${APP_NAME}
      - LETSENCRYPT_HOST=${APP_NAME}
    depends_on:
      - frontend
      - api
    networks:
      nginx-proxy-network:
      frontserver:
      application:
          aliases:
            - ${APP_NAME}
  
  alloy:
    image: grafana/alloy:latest
    container_name: argusAlloy
    restart: unless-stopped
    tty: true
    environment:
      - LOKI_MONITORING_ENDPOINT=${LOKI_MONITORING_ENDPOINT}
      - PROMETHEUS_MONITORING_ENDPOINT=${PROMETHEUS_MONITORING_ENDPOINT}
      - MONITORING_AUTH_USER=${MONITORING_AUTH_USER}
      - MONITORING_AUTH_PASSWORD=${MONITORING_AUTH_PASSWORD}
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro

       # Host metrics
      - /:/host/root:ro,rslave
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro

      # Logs
      - ./log/nginx:/var/log/nginx:ro

    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
    
    depends_on:
      - nginx

volumes:
  postgres_data:
  redis_data:

networks:
  nginx-proxy-network:
    external: true
  frontserver:
    driver: bridge
  application:
    driver: bridge
  backend:
    driver: bridge
