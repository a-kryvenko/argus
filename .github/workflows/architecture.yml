name: Package architecture
on:
  pull_request:
    branches: [master]
concurrency:
  group: architecture-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/workflows/architecture.yml
      - name: Install test dependencies
        run: python -m pip install pytest
      - name: Check clio, prophet and intelligence isolation
        run: python -m pytest tests/test_application_isolation.py

  domain-storage:
    # Forks and Dependabot cannot access the private runtime repositories.
    if: github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: a-kryvenko/argus-forecast-core
          ref: master
          path: packages/forecast-core
          ssh-key: ${{ secrets.FORECAST_CORE_DEPLOY_KEY }}
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: a-kryvenko/argus-intelligence-core
          ref: master
          path: packages/intelligence-core
          ssh-key: ${{ secrets.INTELLIGENCE_CORE_DEPLOY_KEY }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            tests/runtime/uv.lock
            apps/*/pyproject.toml
            packages/*/pyproject.toml
      - name: Check service integration in the locked runtime
        run: ./scripts/test-domain-storage
