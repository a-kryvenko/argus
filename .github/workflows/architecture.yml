name: Package architecture
on:
  pull_request:
    branches: [master]
concurrency:
  group: architecture-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            packages/*/pyproject.toml
            .github/workflows/architecture.yml
      - name: Install public packages and test dependencies
        # The serialization tests exercise the optional joblib model format.
        run: python -m pip install -e packages/common -e packages/forecast pytest httpx fastapi 'joblib>=1.5.3' scikit-learn
      - name: Check boundaries and public imports
        env:
          PYTHONPATH: apps/intelligence/src
        run: >-
          python -m pytest
          tests/test_architecture.py
          apps/intelligence/tests
          tests/test_domain_deployment.py
          tests/test_release_deployment.py tests/test_domain_test_runner.py
          tests/test_argus_cli.py tests/test_argus_entrypoint.py
          tests/test_config.py tests/test_prophet_imports.py
          packages/forecast/tests

  domain-storage:
    # Forks and Dependabot cannot access the private runtime repositories.
    if: github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: a-kryvenko/argus-forecast-core
          ref: master
          path: packages/forecast-core
          ssh-key: ${{ secrets.FORECAST_CORE_DEPLOY_KEY }}
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: a-kryvenko/argus-intelligence-core
          ref: master
          path: packages/intelligence-core
          ssh-key: ${{ secrets.INTELLIGENCE_CORE_DEPLOY_KEY }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            tests/runtime/uv.lock
            apps/*/pyproject.toml
            packages/*/pyproject.toml
      - name: Check service integration in the locked runtime
        run: ./scripts/test-domain-storage
