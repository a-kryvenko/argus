name: Application Deploy

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      rebuild:
        description: Rebuild all images even when source identities are cached (base image updates)
        type: boolean
        default: false

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      private_commit: ${{ steps.plan.outputs.private_commit }}
      intelligence_core_commit: ${{ steps.plan.outputs.intelligence_core_commit }}
      build_matrix: ${{ steps.plan.outputs.build_matrix }}
      has_builds: ${{ steps.plan.outputs.has_builds }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Resolve forecast-core
        uses: actions/checkout@v6
        with:
          repository: a-kryvenko/argus-forecast-core
          ref: master
          path: packages/forecast-core
          ssh-key: ${{ secrets.FORECAST_CORE_DEPLOY_KEY }}
          persist-credentials: false

      - name: Resolve intelligence-core
        uses: actions/checkout@v6
        with:
          repository: a-kryvenko/argus-intelligence-core
          ref: master
          path: packages/intelligence-core
          ssh-key: ${{ secrets.INTELLIGENCE_CORE_DEPLOY_KEY }}
          persist-credentials: false

      - name: Compute image identities and migration fingerprints
        env:
          REBUILD_NONCE: ${{ inputs.rebuild && format('{0}-{1}', github.run_id, github.run_attempt) || '' }}
        run: |
          python3 -m pip install pyyaml
          python3 scripts/deployment/release.py plan --rebuild "$REBUILD_NONCE" --output release-plan.json

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Resolve cached images and select builds
        id: plan
        run: python3 scripts/deployment/release.py resolve --plan release-plan.json --output release-plan.json --github-output "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: release-plan
          path: release-plan.json

  validate:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: a-kryvenko/argus-forecast-core
          ref: ${{ needs.plan.outputs.private_commit }}
          path: packages/forecast-core
          ssh-key: ${{ secrets.FORECAST_CORE_DEPLOY_KEY }}
          persist-credentials: false

      - uses: actions/checkout@v6
        with:
          repository: a-kryvenko/argus-intelligence-core
          ref: ${{ needs.plan.outputs.intelligence_core_commit }}
          path: packages/intelligence-core
          ssh-key: ${{ secrets.INTELLIGENCE_CORE_DEPLOY_KEY }}
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/workflows/deploy.yml

      - name: Validate architecture and deployment
        run: |
          python3 -m pip install pytest pytest-xdist pyyaml alembic
          python3 -m pytest -q tests/architecture/test_boundaries.py tests/architecture/test_isolation.py tests/deployment tests/cli

      - name: Check HTTP replacement and recovery with Docker
        env:
          TEST_ROLLING_DOCKER: '1'
        run: python3 -m pytest -q -n 4 tests/integration/test_rolling_http.py

  images:
    needs: plan
    if: needs.plan.outputs.has_builds == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.build_matrix) }}
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check out the exact private backend used by the plan
        if: matrix.component == 'prophet' || matrix.component == 'proswin'
        uses: actions/checkout@v6
        with:
          repository: a-kryvenko/argus-forecast-core
          ref: ${{ needs.plan.outputs.private_commit }}
          path: packages/forecast-core
          ssh-key: ${{ secrets.FORECAST_CORE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Check out the exact private intelligence core used by the plan
        if: matrix.component == 'intelligence'
        uses: actions/checkout@v6
        with:
          repository: a-kryvenko/argus-intelligence-core
          ref: ${{ needs.plan.outputs.intelligence_core_commit }}
          path: packages/intelligence-core
          ssh-key: ${{ secrets.INTELLIGENCE_CORE_DEPLOY_KEY }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build changed component
        id: build
        uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671
        with:
          context: .
          file: .deploy/${{ matrix.component }}.Dockerfile
          push: true
          build-args: |
            DEPLOYMENT_VERSION=${{ matrix.tag }}
          tags: ${{ matrix.repository }}:${{ matrix.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          # Registry cache is shared across release tags and includes builder stages.
          cache-from: type=registry,ref=${{ matrix.repository }}:buildcache
          cache-to: type=registry,ref=${{ matrix.repository }}:buildcache,mode=max
      - name: Attest newly built image
        uses: actions/attest@v4
        with:
          subject-name: ${{ matrix.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Pin the resulting image digest
        env:
          COMPONENT: ${{ matrix.component }}
          IMAGE: ${{ matrix.repository }}
          TAG: ${{ matrix.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          python3 - <<'PY'
          import json, os, re
          digest = os.environ['DIGEST']
          if not re.fullmatch(r'sha256:[0-9a-f]{64}', digest):
              raise SystemExit('Invalid registry digest')
          with open(os.environ['COMPONENT'] + '.json', 'w') as output:
              json.dump({'tag': os.environ['TAG'], 'image': os.environ['IMAGE'] + '@' + digest}, output)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.component }}
          path: ${{ matrix.component }}.json

  deploy:
    needs: [plan, validate, images]
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' &&
          needs.validate.result == 'success' &&
          (needs.images.result == 'success' ||
           (needs.images.result == 'skipped' && needs.plan.outputs.has_builds == 'false')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: release-plan
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.has_builds == 'true'
        with:
          pattern: image-*
          merge-multiple: true
          path: image-results
      - name: Assemble the release bundle
        run: python3 scripts/deployment/release.py bundle --plan release-plan.json --images image-results --output release-bundle
      - name: Upload to a unique staging directory
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          source: release-bundle
          target: /var/www/incoming/${{ github.run_id }}-${{ github.run_attempt }}
      - name: Apply the release
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          RELEASE_DIRECTORY: /var/www/incoming/${{ github.run_id }}-${{ github.run_attempt }}/release-bundle
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          envs: GHCR_USERNAME,GHCR_READ_TOKEN,RELEASE_DIRECTORY
          command_timeout: 30m
          script: |
            set -eu
            printf '%s' "$GHCR_READ_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
            bash "$RELEASE_DIRECTORY/deploy.sh" /var/www
