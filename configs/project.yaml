project:
  name: argus-sunwatch

prophet:
  calculation_timeout_seconds: 540
  shutdown_grace_seconds: 570
  verification_days: 30

api:
  summary:
    ttl_seconds: 600
    image_ttl_seconds: 1800
    cme_grace_hours: 24
    critical_levels:
      v: [450, 500, 600, 700]
      # Display bands for plasma; not standardized geomagnetic hazard thresholds.
      n: [10, 20, 50, 80]
      t: [100000, 200000, 500000, 800000]
      kp: [4, 5, 6, 7]
      ap: [27, 48, 80, 112]
      dst: [-30, -50, -100, -150]
      bt: [5, 10, 15, 20]
      bx: [5, 10, 15, 20]
      by: [5, 10, 15, 20]
      bz: [-5, -10, -15, -20]
      # Solar activity bands: doi:10.1029/2020SW002496, Table 1.
      f10_7: [75, 150, 190]
      s10: [65, 150, 215]
      m10: [72, 144, 167]
      y10: [81, 148, 165]

# Observation sources and historical horizons.
clio:
  sdo_browse_enabled: true
  retention:
    live_days: 6
    normalized_days: 60
  solar_wind_events:
    enabled: true
    lookback_days: 30
  sdo_images:
    enabled: true
    backfill_days: 45
  observations:
    gong:
      sources:
        live: [gong.live]
        historical: [gong.archive]
      backfill_days: 2
    bx:
      sources:
        live: [swpc.rtsw_mag]
        historical: [omni.hourly]
      backfill_days: 60
    by:
      sources:
        live: [swpc.rtsw_mag]
        historical: [omni.hourly]
      backfill_days: 60
    bz:
      sources:
        live: [swpc.rtsw_mag]
        historical: [omni.hourly]
      backfill_days: 60
    v:
      sources:
        live: [swpc.rtsw_plasma]
        historical: [omni.hourly, ace.plasma_hourly, soho.plasma_hourly]
      backfill_days: 60
    n:
      sources:
        live: [swpc.rtsw_plasma]
        historical: [omni.hourly, ace.plasma_hourly, soho.plasma_hourly]
      backfill_days: 60
    t:
      sources:
        live: [swpc.rtsw_plasma]
        historical: [omni.hourly, ace.plasma_hourly, soho.plasma_hourly]
      backfill_days: 60
    kp:
      sources:
        live: [swpc.kp]
        historical: [omni.hourly]
      backfill_days: 60
    ap:
      sources:
        live: [swpc.kp]
        historical: [omni.hourly]
      backfill_days: 60
    dst:
      sources:
        live: [swpc.dst]
        historical: [omni.hourly]
      backfill_days: 60
    f10_7:
      sources:
        live: [swpc.f107]
        historical: [gfz.f107, omni.hourly]
      backfill_days: 88
    goes:
      sources:
        live: [goes.live]
        historical: [goes.archive]
      backfill_days: 88
