[project]
name = "forecast"
version = "0.2.0"
description = "Public solar-wind inference and shared forecast primitives for Argus Sunwatch"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2,<3",
  "common",
]

[project.optional-dependencies]
models = ["scikit-learn>=1.5", "lightgbm>=4.6.0", "joblib>=1.5.3"]

[tool.setuptools.package-dir]
"" = "src"

[tool.uv.sources]
common = { workspace = true, editable = true }
