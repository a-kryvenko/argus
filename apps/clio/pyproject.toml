[project]
name = "argus-clio"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "common",
  "beautifulsoup4>=4.15.0",
  "numpy>=1.26",
  "pandas>=2.2",
  "cdflib>=1.1.0",
  "requests>=2.32",
  "xarray>=2026.4.0",
  "h5netcdf>=1.8.1",
  "h5py>=3.16.0",
  "astropy>=6",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sentry-sdk>=2.61.1",
  "alembic>=1.16,<2",
  "sqlalchemy[asyncio]>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
]

[project.scripts]
clio = "clio.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
clio = ["migrations/script.py.mako"]

[tool.uv.sources]
common = { path = "../../packages/common", editable = true }

[tool.uv.workspace]
members = []

[dependency-groups]
test = ["pytest>=8,<10", "httpx>=0.28,<1", "httpx2"]
