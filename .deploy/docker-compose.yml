# Production overrides; merged with ../docker-compose.yml by release tooling.

x-clio-healthcheck: &clio-healthcheck
  start_interval: 1s

x-prophet-environment: &prophet-environment
  OBSERVATIONS_URL: http://observations-router:8101
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
  S3_REGION: ${S3_REGION:-auto}

x-prophet-jobs: &prophet-jobs
  environment:
    <<: *prophet-environment
    S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
    S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-https://media.argussun.com}
    FORECASTS_SERVICE_TOKEN: ${FORECASTS_SERVICE_TOKEN:?FORECASTS_SERVICE_TOKEN is required}
  networks: [backend, observations]
  depends_on: !override
    internal-router:
      condition: service_started
    postgres:
      condition: service_healthy

x-intelligence-runtime: &intelligence-runtime
  restart: unless-stopped
  environment: &intelligence-environment
    FORECASTS_URL: http://forecasts-router:8102

x-api-runtime: &api-runtime
  environment: &api-environment
    FORECASTS_URL: http://forecasts-router:8102
    OBSERVATIONS_URL: http://observations-router:8101

x-http-slot: &http-slot
  depends_on: !override {}

services:
  clio:
    extends:
      file: docker-compose.yml
      service: clio
    profiles: [templates]
    restart: unless-stopped
    environment:
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-https://media.argussun.com}
    healthcheck: *clio-healthcheck
    networks:
      backend:
      observations:
    expose:
      - '8000'

  prophet:
    <<: *prophet-jobs

  prophet-worker:
    <<: *prophet-jobs
    healthcheck:
      start_interval: 1s

  prophet-api:
    extends:
      file: docker-compose.yml
      service: prophet-api
    profiles: [templates]
    restart: unless-stopped
    expose:
      - '8000'
    networks: [backend, forecasts]
    healthcheck:
      start_interval: 1s

  proswin:
    environment:
      OBSERVATIONS_URL: http://observations-router:8101
      OBSERVATIONS_SERVICE_TOKEN: ${OBSERVATIONS_SERVICE_TOKEN:?OBSERVATIONS_SERVICE_TOKEN is required}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_ACCESS_KEY_ID: ${S3_READ_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_READ_SECRET_ACCESS_KEY:-}
      S3_REGION: ${S3_REGION:-auto}
    networks: [observations]

    depends_on: !override
      internal-router:
        condition: service_started

  intelligence:
    <<: *intelligence-runtime
    environment:
      <<: *intelligence-environment
      INTELLIGENCE_SERVICE_TOKEN: ${INTELLIGENCE_SERVICE_TOKEN:?INTELLIGENCE_SERVICE_TOKEN is required}
    networks: [backend, forecasts]
    healthcheck:
      start_interval: 1s

    depends_on: !override
      internal-router:
        condition: service_started
      postgres:
        condition: service_healthy

  intelligence-api:
    extends:
      file: docker-compose.yml
      service: intelligence-api
    profiles: [templates]
    <<: *intelligence-runtime
    environment:
      <<: *intelligence-environment
      INTELLIGENCE_EXPERIMENTAL_DRAG_MONITOR: ${INTELLIGENCE_EXPERIMENTAL_DRAG_MONITOR:-false}
    networks: [backend, forecasts, impacts]
    healthcheck:
      start_interval: 1s

  api:
    extends:
      file: docker-compose.yml
      service: api
    profiles: [templates]
    <<: *api-runtime
    environment:
      <<: *api-environment
      INTELLIGENCE_URL: http://impacts-router:8103
      DASHBOARD_ORIGINS: ${DASHBOARD_ORIGINS-https://${APP_NAME:?APP_NAME is required}}
      DASHBOARD_COOKIE_SECURE: ${DASHBOARD_COOKIE_SECURE:-true}
    restart: unless-stopped
    tty: true
    expose:
      - '8000'
    volumes:
      - ./log/api:/var/www/log
    networks:
      application:
      backend:
      observations:
      forecasts:
      impacts:
    healthcheck:
      retries: 3
      start_interval: 1s
    stop_grace_period: 60s

  frontend:
    profiles: [templates]
    image: ghcr.io/a-kryvenko/argus-frontend:latest
    restart: unless-stopped
    tty: true
    expose:
      - '3000'
    environment:
      DEMO_BUNDLE_PATH: /var/www/demo/current.json
    volumes:
      - ./log/frontend:/var/www/log
      - ./data/demo:/var/www/demo:ro
    depends_on:
      - api
    networks:
      application:
    healthcheck:
      test: [CMD, node, -e, 'fetch(''http://127.0.0.1:3000/'').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
      start_interval: 1s
    stop_grace_period: 60s

  postgres:
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    networks:
      backend:

  redis:
    networks:
      backend:

  nginx:
    image: nginx:latest
    container_name: argusNginx
    restart: unless-stopped
    tty: true
    expose:
      - '80'
    volumes:
      - ./log/nginx:/var/www/log
      - ./.docker/nginx/default.conf:/etc/nginx/includes/default.conf
      - ./.docker/nginx/templates/http.conf.template:/etc/nginx/templates/website.conf.template
      - ./data/next-static:/var/www/next-static:ro
    environment:
      - HOSTNAME=${APP_NAME}
      - APP_NAME=${APP_NAME}
      - VIRTUAL_HOST=${APP_NAME}
      - LETSENCRYPT_HOST=${APP_NAME}
    networks:
      nginx-proxy-network:
      frontserver:
      application:
        aliases:
          - ${APP_NAME}

  maintenance:
    image: nginx:stable-alpine
    scale: 0
    restart: unless-stopped
    expose: ['80']
    volumes:
      - ./.docker/maintenance/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.docker/maintenance/index.html:/usr/share/nginx/html/maintenance.html:ro
    environment:
      VIRTUAL_HOST: ${APP_NAME}
      LETSENCRYPT_HOST: ${APP_NAME}
    networks: [nginx-proxy-network]
    healthcheck:
      test: [CMD, nginx, -t]
      interval: 1s
      timeout: 5s
      retries: 5

  alloy:
    image: grafana/alloy:latest
    container_name: argusAlloy
    restart: unless-stopped
    tty: true
    environment:
      - LOKI_MONITORING_ENDPOINT=${LOKI_MONITORING_ENDPOINT}
      - PROMETHEUS_MONITORING_ENDPOINT=${PROMETHEUS_MONITORING_ENDPOINT}
      - MONITORING_AUTH_USER=${MONITORING_AUTH_USER}
      - MONITORING_AUTH_PASSWORD=${MONITORING_AUTH_PASSWORD}
    volumes:
      - ./.docker/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /:/host/root:ro,rslave
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - ./log/nginx:/var/log/nginx:ro
      - alloy_data:/var/lib/alloy/data
    command: [run, /etc/alloy/config.alloy, '--server.http.listen-addr=0.0.0.0:12345', '--storage.path=/var/lib/alloy/data']
    depends_on:
      - nginx

  clio-worker:
    restart: unless-stopped
    environment:
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_REGION: ${S3_REGION:-auto}
    healthcheck: *clio-healthcheck
    networks:
      backend:

  clio-blue:
    <<: *http-slot
    extends:
      service: clio
    profiles: !override [blue]

  prophet-api-blue:
    <<: *http-slot
    extends:
      service: prophet-api
    profiles: !override [blue]

  intelligence-api-blue:
    <<: *http-slot
    extends:
      service: intelligence-api
    profiles: !override [blue]

  api-blue:
    <<: *http-slot
    extends:
      service: api
    profiles: !override [blue]

  frontend-blue:
    <<: *http-slot
    extends:
      service: frontend
    profiles: !override [blue]

  clio-green:
    <<: *http-slot
    extends:
      service: clio
    profiles: !override [green]

  prophet-api-green:
    <<: *http-slot
    extends:
      service: prophet-api
    profiles: !override [green]

  intelligence-api-green:
    <<: *http-slot
    extends:
      service: intelligence-api
    profiles: !override [green]

  api-green:
    <<: *http-slot
    extends:
      service: api
    profiles: !override [green]

  frontend-green:
    <<: *http-slot
    extends:
      service: frontend
    profiles: !override [green]

  internal-router:
    image: nginx:stable-alpine
    restart: unless-stopped
    volumes:
      - ./routes/internal:/etc/nginx/conf.d:ro
    networks:
      observations:
        aliases: [observations-router]
      forecasts:
        aliases: [forecasts-router]
      impacts:
        aliases: [impacts-router]
      application:
        aliases: [application-router]
    healthcheck:
      test: [CMD, nginx, -t]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 1s
    stop_grace_period: 120s

volumes:
  alloy_data:

networks:
  nginx-proxy-network:
    external: true
  frontserver:
    driver: bridge
  application:
    driver: bridge
  backend:
    driver: bridge
  observations:
    driver: bridge
  forecasts:
    driver: bridge
  impacts:
    driver: bridge
