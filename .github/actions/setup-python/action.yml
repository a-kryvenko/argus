name: Set up Python environment
description: Install python and optionally uv

inputs:
  install_uv:
    description: Install uv
    default: 'true'

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    
    - name: Install uv
      if: inputs.install_uv == 'true'
      shell: bash
      run: python -m pip install uv