# Shared service definitions. Use the dev or production override.

x-clio-runtime: &clio-runtime
  init: true
  volumes:
    - ./configs:/var/www/configs:ro
  stop_grace_period: 10m
  depends_on: &clio-depends_on
    postgres:
      condition: service_healthy
  environment: &clio-environment
    CLIO_DB_NAME: ${CLIO_DB_NAME:?CLIO_DB_NAME is required}
    CLIO_DB_USER: ${CLIO_DB_USER:?CLIO_DB_USER is required}
    CLIO_DB_PASSWORD: ${CLIO_DB_PASSWORD:?CLIO_DB_PASSWORD is required}
    ARGUS_WORKDIR: /var/www
    DEBUG: ${DEBUG:-false}
    OBSERVATIONS_SERVICE_TOKEN: ${OBSERVATIONS_SERVICE_TOKEN:?OBSERVATIONS_SERVICE_TOKEN is required}
    SENTRY_COLLECT_POINT: ${SENTRY_COLLECT_POINT:-}
    CLIO_DB_HOST: ${CLIO_DB_HOST:-postgres}
    CLIO_DB_PORT: ${CLIO_DB_PORT:-5432}
  healthcheck: &clio-healthcheck
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 30s
  image: ${ARGUS_CLIO_IMAGE:-ghcr.io/a-kryvenko/argus-clio:latest}

x-prophet-runtime: &prophet-runtime
  init: true
  volumes:
    - ./configs:/var/www/configs:ro
  depends_on: &prophet-depends_on
    postgres:
      condition: service_healthy
  environment: &prophet-environment
    PROPHET_DB_NAME: ${PROPHET_DB_NAME:?PROPHET_DB_NAME is required}
    PROPHET_DB_USER: ${PROPHET_DB_USER:?PROPHET_DB_USER is required}
    PROPHET_DB_PASSWORD: ${PROPHET_DB_PASSWORD:?PROPHET_DB_PASSWORD is required}
    ARGUS_WORKDIR: /var/www
    PROPHET_DB_HOST: ${PROPHET_DB_HOST:-postgres}
    PROPHET_DB_PORT: ${PROPHET_DB_PORT:-5432}
  image: ${ARGUS_PROPHET_IMAGE:-ghcr.io/a-kryvenko/argus-prophet:latest}

x-intelligence-runtime: &intelligence-runtime
  init: true
  volumes:
    - ./configs:/var/www/configs:ro
  depends_on: &intelligence-depends_on
    postgres:
      condition: service_healthy
    prophet-api:
      condition: service_started
  environment: &intelligence-environment
    INTELLIGENCE_DB_NAME: ${INTELLIGENCE_DB_NAME:?INTELLIGENCE_DB_NAME is required}
    INTELLIGENCE_DB_USER: ${INTELLIGENCE_DB_USER:?INTELLIGENCE_DB_USER is required}
    INTELLIGENCE_DB_PASSWORD: ${INTELLIGENCE_DB_PASSWORD:?INTELLIGENCE_DB_PASSWORD is required}
    FORECASTS_SERVICE_TOKEN: ${FORECASTS_SERVICE_TOKEN:?FORECASTS_SERVICE_TOKEN is required}
    ARGUS_WORKDIR: /var/www
    INTELLIGENCE_DB_HOST: ${INTELLIGENCE_DB_HOST:-postgres}
    INTELLIGENCE_DB_PORT: ${INTELLIGENCE_DB_PORT:-5432}
  image: ${ARGUS_INTELLIGENCE_IMAGE:-ghcr.io/a-kryvenko/argus-intelligence:latest}

x-api-runtime: &api-runtime
  environment: &api-environment
    API_DB_NAME: ${API_DB_NAME:?API_DB_NAME is required}
    API_DB_USER: ${API_DB_USER:?API_DB_USER is required}
    API_DB_PASSWORD: ${API_DB_PASSWORD:?API_DB_PASSWORD is required}
    ARGUS_WORKDIR: /var/www
    SENTRY_COLLECT_POINT: ${SENTRY_COLLECT_POINT:-}
    FORECASTS_SERVICE_TOKEN: ${FORECASTS_SERVICE_TOKEN:?FORECASTS_SERVICE_TOKEN is required}
    OBSERVATIONS_SERVICE_TOKEN: ${OBSERVATIONS_SERVICE_TOKEN:?OBSERVATIONS_SERVICE_TOKEN is required}
    API_DB_HOST: ${API_DB_HOST:-postgres}
    API_DB_PORT: ${API_DB_PORT:-5432}
  volumes:
    - ./configs:/var/www/configs:ro
  depends_on: &api-depends_on
    postgres:
      condition: service_healthy
    prophet-api:
      condition: service_started
  image: ${ARGUS_API_IMAGE:-ghcr.io/a-kryvenko/argus-forecast:latest}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 5

  clio:
    <<: *clio-runtime
    healthcheck:
      <<: *clio-healthcheck
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"]
    command: [.venv/bin/uvicorn, 'clio.main:app', --host, 0.0.0.0, --port, '8000']

  clio-worker:
    <<: *clio-runtime
    healthcheck:
      <<: *clio-healthcheck
      test: [CMD, .venv/bin/python, -m, clio.scheduler.healthcheck, /tmp/clio/worker-state.json]
    command: [.venv/bin/python, -m, clio.scheduler.worker, --heartbeat-file, /tmp/clio/worker-state.json]

  prophet:
    <<: *prophet-runtime
    volumes:
      - ./configs:/var/www/configs:ro
      - ./data/models:/var/www/data/models:ro
      - ./data/prophet:/var/www/data/prophet
      - ./data/demo:/var/www/data/demo
    depends_on:
      <<: *prophet-depends_on
      clio:
        condition: service_started
    environment:
      <<: *prophet-environment
      OBSERVATIONS_SERVICE_TOKEN: ${OBSERVATIONS_SERVICE_TOKEN:?OBSERVATIONS_SERVICE_TOKEN is required}
      SENTRY_COLLECT_POINT: ${SENTRY_COLLECT_POINT:-}
    profiles: [commands]
    restart: 'no'
    command: [prophet, --help]
    stop_grace_period: 10m

  prophet-api:
    <<: *prophet-runtime
    environment:
      <<: *prophet-environment
      FORECASTS_SERVICE_TOKEN: ${FORECASTS_SERVICE_TOKEN:?FORECASTS_SERVICE_TOKEN is required}
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=15)"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s
    command: [prophet, serve]

  proswin:
    command: [python, -m, prophet.services.proswin.queue]
    mem_limit: 1536m
    memswap_limit: 1536m
    restart: unless-stopped
    init: true
    environment:
      ARGUS_WORKDIR: /var/www
    volumes:
      - ./configs:/var/www/configs:ro
      - ./data/models:/var/www/data/models:ro
      - ./data/prophet:/var/www/data/prophet
    depends_on:
      clio:
        condition: service_started
    image: ${ARGUS_PROSWIN_IMAGE:-ghcr.io/a-kryvenko/argus-proswin:latest}

  intelligence:
    <<: *intelligence-runtime
    environment:
      <<: *intelligence-environment
      INTELLIGENCE_EXPERIMENTAL_DRAG_MONITOR: ${INTELLIGENCE_EXPERIMENTAL_DRAG_MONITOR:-false}
    command: [intelligence, worker]
    stop_grace_period: 2m

  intelligence-api:
    <<: *intelligence-runtime
    environment:
      <<: *intelligence-environment
      INTELLIGENCE_SERVICE_TOKEN: ${INTELLIGENCE_SERVICE_TOKEN:?INTELLIGENCE_SERVICE_TOKEN is required}
    command: [intelligence, serve]
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  api:
    <<: *api-runtime
    environment:
      <<: *api-environment
      DEBUG: ${DEBUG:-false}
      INTELLIGENCE_SERVICE_TOKEN: ${INTELLIGENCE_SERVICE_TOKEN:?INTELLIGENCE_SERVICE_TOKEN is required}
      API_REDIS_URL: redis://redis:6379/0
    volumes:
      - ./configs:/var/www/configs:ro
      - ./data/metrics:/var/www/data/metrics:ro
      - ./data/demo:/var/www/data/demo:ro
    depends_on:
      <<: *api-depends_on
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 30s

  db-provision:
    environment:
      INTELLIGENCE_DB_NAME: ${INTELLIGENCE_DB_NAME:?INTELLIGENCE_DB_NAME is required}
      INTELLIGENCE_DB_USER: ${INTELLIGENCE_DB_USER:?INTELLIGENCE_DB_USER is required}
      INTELLIGENCE_DB_PASSWORD: ${INTELLIGENCE_DB_PASSWORD:?INTELLIGENCE_DB_PASSWORD is required}
      PROPHET_DB_NAME: ${PROPHET_DB_NAME:?PROPHET_DB_NAME is required}
      PROPHET_DB_USER: ${PROPHET_DB_USER:?PROPHET_DB_USER is required}
      PROPHET_DB_PASSWORD: ${PROPHET_DB_PASSWORD:?PROPHET_DB_PASSWORD is required}
      CLIO_DB_NAME: ${CLIO_DB_NAME:?CLIO_DB_NAME is required}
      CLIO_DB_USER: ${CLIO_DB_USER:?CLIO_DB_USER is required}
      CLIO_DB_PASSWORD: ${CLIO_DB_PASSWORD:?CLIO_DB_PASSWORD is required}
      API_DB_NAME: ${API_DB_NAME:?API_DB_NAME is required}
      API_DB_USER: ${API_DB_USER:?API_DB_USER is required}
      API_DB_PASSWORD: ${API_DB_PASSWORD:?API_DB_PASSWORD is required}
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      INTELLIGENCE_DB_HOST: ${INTELLIGENCE_DB_HOST:-postgres}
      INTELLIGENCE_DB_PORT: ${INTELLIGENCE_DB_PORT:-5432}
      PROPHET_DB_HOST: ${PROPHET_DB_HOST:-postgres}
      PROPHET_DB_PORT: ${PROPHET_DB_PORT:-5432}
      CLIO_DB_HOST: ${CLIO_DB_HOST:-postgres}
      CLIO_DB_PORT: ${CLIO_DB_PORT:-5432}
      API_DB_HOST: ${API_DB_HOST:-postgres}
      API_DB_PORT: ${API_DB_PORT:-5432}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
    command: [.venv/bin/python, /var/www/scripts/db/provision.py, --apply]
    profiles: [maintenance]
    image: ${ARGUS_API_IMAGE:-ghcr.io/a-kryvenko/argus-forecast:latest}

volumes:
  postgres_data:
  redis_data:
