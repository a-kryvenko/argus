[project]
name = "forecast"
version = "0.3.0"
description = "Public solar-wind inference and shared forecast primitives for Argus Sunwatch"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2,<3",
  "common",
]

[project.optional-dependencies]
models = ["scikit-learn>=1.5", "lightgbm>=4.6.0", "joblib>=1.5.3"]

[tool.setuptools.package-dir]
"" = "src"

[tool.uv.sources]
common = { path = "../common", editable = true }

[tool.uv.workspace]
members = []

[dependency-groups]
test = ["pytest>=8,<10", "scikit-learn>=1.5", "lightgbm>=4.6.0", "joblib>=1.5.3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
