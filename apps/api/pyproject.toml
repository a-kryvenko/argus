[project]
name = "argus-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "pandas>=2.2,<3",
  "numpy>=1.26",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.28,<1",
  "common",
  "sentry-sdk>=2.61.1",
  "pydantic>=2.13.4",
  "pydantic-settings>=2.14.1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
]

[tool.uv.sources]
common = { workspace = true }

[tool.uv.workspace]
members = [
    "../../packages/common",
]
