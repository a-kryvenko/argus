name: Package architecture
on:
  push:
    branches:
      - '**'
  pull_request:
concurrency:
  group: architecture-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            packages/*/pyproject.toml
            .github/workflows/architecture.yml
      - name: Install public packages only
        run: python -m pip install -e packages/common -e packages/forecast pytest httpx
      - name: Check boundaries and public imports
        env:
          PYTHONPATH: apps/intelligence/src
        run: >-
          python -m pytest
          tests/test_architecture.py
          apps/intelligence/tests
          tests/test_domain_deployment.py
          tests/test_release_deployment.py
          tests/test_argus_cli.py
          tests/test_database_transfer.py
          tests/test_config.py
          packages/forecast/tests/test_smoke_pipeline.py

  domain-storage:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_ADMIN_DSN: postgresql://postgres:test-postgres@127.0.0.1:5432/postgres
      PYTHONPATH: apps/api:apps/clio/src:apps/prophet/src:apps/intelligence/src:packages/common/src:packages/clio/src
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            packages/*/pyproject.toml
            .github/workflows/architecture.yml
      - name: Install public observation runtime and test dependencies
        run: >-
          python -m pip install -e packages/common -e packages/clio
          pytest sqlalchemy 'psycopg[binary]' alembic fastapi uvicorn httpx sentry-sdk
      - name: Check separate databases, ownership, transfer and scheduling
        env:
          TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: python -m pytest -q tests/test_database_urls.py tests/integration/test_domain_storage.py tests/integration/test_prophet_ledger.py tests/integration/test_prophet_scheduler.py tests/integration/test_intelligence_worker.py
      - name: Check aggregation, retention and collection recovery
        run: |
          python apps/clio/tests/integration/verify_solar_wind_aggregation.py
          python apps/clio/tests/integration/verify_solar_wind_retention.py
          python apps/clio/tests/integration/verify_observation_recovery.py
      - name: Check dashboard through the Clio read interface
        run: python apps/api/tests/integration/verify_dashboard.py
