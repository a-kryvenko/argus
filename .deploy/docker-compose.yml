x-admin-db: &admin-db
  DB_HOST: ${DB_HOST:-postgres}
  DB_PORT: ${DB_PORT:-5432}
  DB_NAME: ${DB_NAME:?DB_NAME is required}
  DB_USER: ${DB_USER:?DB_USER is required}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}

x-api-db: &api-db
  API_DB_HOST: ${API_DB_HOST:-postgres}
  API_DB_PORT: ${API_DB_PORT:-5432}
  API_DB_NAME: ${API_DB_NAME:?API_DB_NAME is required}
  API_DB_USER: ${API_DB_USER:?API_DB_USER is required}
  API_DB_PASSWORD: ${API_DB_PASSWORD:?API_DB_PASSWORD is required}

x-clio-db: &clio-db
  CLIO_DB_HOST: ${CLIO_DB_HOST:-postgres}
  CLIO_DB_PORT: ${CLIO_DB_PORT:-5432}
  CLIO_DB_NAME: ${CLIO_DB_NAME:?CLIO_DB_NAME is required}
  CLIO_DB_USER: ${CLIO_DB_USER:?CLIO_DB_USER is required}
  CLIO_DB_PASSWORD: ${CLIO_DB_PASSWORD:?CLIO_DB_PASSWORD is required}

x-prophet-db: &prophet-db
  PROPHET_DB_HOST: ${PROPHET_DB_HOST:-postgres}
  PROPHET_DB_PORT: ${PROPHET_DB_PORT:-5432}
  PROPHET_DB_NAME: ${PROPHET_DB_NAME:?PROPHET_DB_NAME is required}
  PROPHET_DB_USER: ${PROPHET_DB_USER:?PROPHET_DB_USER is required}
  PROPHET_DB_PASSWORD: ${PROPHET_DB_PASSWORD:?PROPHET_DB_PASSWORD is required}

x-intelligence-db: &intelligence-db
  INTELLIGENCE_DB_HOST: ${INTELLIGENCE_DB_HOST:-postgres}
  INTELLIGENCE_DB_PORT: ${INTELLIGENCE_DB_PORT:-5432}
  INTELLIGENCE_DB_NAME: ${INTELLIGENCE_DB_NAME:?INTELLIGENCE_DB_NAME is required}
  INTELLIGENCE_DB_USER: ${INTELLIGENCE_DB_USER:?INTELLIGENCE_DB_USER is required}
  INTELLIGENCE_DB_PASSWORD: ${INTELLIGENCE_DB_PASSWORD:?INTELLIGENCE_DB_PASSWORD is required}

x-clio-runtime: &clio-runtime
  image: ${ARGUS_CLIO_IMAGE:-ghcr.io/a-kryvenko/argus-clio:latest}
  restart: unless-stopped
  init: true
  stop_grace_period: 10m
  environment:
    ARGUS_WORKDIR: /var/www
    DEBUG: ${DEBUG:-false}
    <<: *clio-db
    OBSERVATIONS_SERVICE_TOKEN: ${OBSERVATIONS_SERVICE_TOKEN:?OBSERVATIONS_SERVICE_TOKEN is required}
    SENTRY_COLLECT_POINT: ${SENTRY_COLLECT_POINT:-}
  volumes:
    - ./configs:/var/www/configs:ro
    - ./data/observations:/var/www/data/observations
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    backend:

x-prophet-runtime: &prophet-runtime
  image: ${ARGUS_PROPHET_IMAGE:-ghcr.io/a-kryvenko/argus-prophet:latest}
  restart: unless-stopped
  init: true
  environment:
    ARGUS_WORKDIR: /var/www
    <<: *prophet-db
    OBSERVATIONS_URL: http://clio:8000
    OBSERVATIONS_SERVICE_TOKEN: ${OBSERVATIONS_SERVICE_TOKEN:?OBSERVATIONS_SERVICE_TOKEN is required}
    SENTRY_COLLECT_POINT: ${SENTRY_COLLECT_POINT:-}
    FORECASTS_SERVICE_TOKEN: ${FORECASTS_SERVICE_TOKEN:?FORECASTS_SERVICE_TOKEN is required}
  volumes:
    - ./configs:/var/www/configs:ro
  depends_on:
    postgres:
      condition: service_healthy

x-intelligence-runtime: &intelligence-runtime
  image: ${ARGUS_INTELLIGENCE_IMAGE:-ghcr.io/a-kryvenko/argus-intelligence:latest}
  restart: unless-stopped
  init: true
  environment:
    ARGUS_WORKDIR: /var/www
    INTELLIGENCE_EXPERIMENTAL_DRAG_MONITOR: ${INTELLIGENCE_EXPERIMENTAL_DRAG_MONITOR:-false}
    <<: *intelligence-db
    FORECASTS_URL: http://prophet-api:8000
    FORECASTS_SERVICE_TOKEN: ${FORECASTS_SERVICE_TOKEN:?FORECASTS_SERVICE_TOKEN is required}
    INTELLIGENCE_SERVICE_TOKEN: ${INTELLIGENCE_SERVICE_TOKEN:?INTELLIGENCE_SERVICE_TOKEN is required}
  volumes:
    - ./configs:/var/www/configs:ro
  depends_on:
    postgres:
      condition: service_healthy
    prophet-api:
      condition: service_started

services:
  clio:
    <<: *clio-runtime
    command: ["clio", "serve"]
    expose: ["8000"]
    networks:
      backend:
      observations:
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
      # Detect readiness promptly before starting dependent services.
      start_interval: 1s

  clio-migrate:
    image: ${ARGUS_CLIO_IMAGE:-ghcr.io/a-kryvenko/argus-clio:latest}
    profiles: ["maintenance"]
    command: ["alembic", "upgrade", "head"]
    environment:
      ARGUS_WORKDIR: /var/www
      <<: *clio-db
    volumes:
      - ./configs:/var/www/configs:ro
      - ./data/observations:/var/www/data/observations
    networks: [backend]

  prophet:
    <<: *prophet-runtime
    profiles: ["commands"]
    restart: "no"
    command: ["prophet", "--help"]
    stop_grace_period: 10m
    volumes:
      - ./configs:/var/www/configs:ro
      - ./data/models:/var/www/data/models:ro
      - ./data/prophet:/var/www/data/prophet
      - ./data/demo:/var/www/data/demo
    depends_on:
      postgres:
        condition: service_healthy
      clio:
        condition: service_started
    networks:
      backend:
      observations:

  prophet-api:
    <<: *prophet-runtime
    command: ["prophet", "serve"]
    expose: ["8000"]
    networks: [backend, forecasts]
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=15)"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s
      # Detect readiness promptly before starting dependent services.
      start_interval: 1s

  prophet-migrate:
    image: ${ARGUS_PROPHET_IMAGE:-ghcr.io/a-kryvenko/argus-prophet:latest}
    profiles: ["maintenance"]
    command: ["alembic", "upgrade", "head"]
    environment:
      ARGUS_WORKDIR: /var/www
      <<: *prophet-db
    volumes:
      - ./configs:/var/www/configs:ro
    networks: [backend]

  proswin:
    image: ${ARGUS_PROSWIN_IMAGE:-ghcr.io/a-kryvenko/argus-proswin:latest}
    command: ["python", "-m", "prophet.services.proswin.queue"]
    mem_limit: 1536m
    memswap_limit: 1536m
    restart: unless-stopped
    init: true
    environment:
      ARGUS_WORKDIR: /var/www
      OBSERVATIONS_URL: http://clio:8000
      OBSERVATIONS_SERVICE_TOKEN: ${OBSERVATIONS_SERVICE_TOKEN:?OBSERVATIONS_SERVICE_TOKEN is required}
    volumes:
      - ./configs:/var/www/configs:ro
      - ./data/models:/var/www/data/models:ro
      - ./data/prophet:/var/www/data/prophet
    depends_on:
      clio:
        condition: service_started
    networks: [observations]

  intelligence:
    <<: *intelligence-runtime
    stop_grace_period: 2m
    command: ["intelligence", "worker"]
    networks: [backend, forecasts]

  intelligence-api:
    <<: *intelligence-runtime
    command: ["intelligence", "serve"]
    networks: [backend, forecasts, impacts]
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
      # Detect readiness promptly before starting dependent services.
      start_interval: 1s

  intelligence-migrate:
    image: ${ARGUS_INTELLIGENCE_IMAGE:-ghcr.io/a-kryvenko/argus-intelligence:latest}
    profiles: ["maintenance"]
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *intelligence-db
    networks: [backend]

  api:
    image: ${ARGUS_API_IMAGE:-ghcr.io/a-kryvenko/argus-forecast:latest}
    container_name: argusForecast
    restart: unless-stopped
    tty: true
    environment:
      ARGUS_WORKDIR: /var/www
      DEBUG: ${DEBUG:-false}
      <<: *api-db
      SENTRY_COLLECT_POINT: ${SENTRY_COLLECT_POINT:-}
      INTELLIGENCE_URL: http://intelligence-api:8000
      INTELLIGENCE_SERVICE_TOKEN: ${INTELLIGENCE_SERVICE_TOKEN:?INTELLIGENCE_SERVICE_TOKEN is required}
      FORECASTS_URL: http://prophet-api:8000
      FORECASTS_SERVICE_TOKEN: ${FORECASTS_SERVICE_TOKEN:?FORECASTS_SERVICE_TOKEN is required}
      OBSERVATIONS_URL: http://clio:8000
      OBSERVATIONS_SERVICE_TOKEN: ${OBSERVATIONS_SERVICE_TOKEN:?OBSERVATIONS_SERVICE_TOKEN is required}
      DASHBOARD_ORIGINS: ${DASHBOARD_ORIGINS-https://${APP_NAME:?APP_NAME is required}}
      DASHBOARD_COOKIE_SECURE: ${DASHBOARD_COOKIE_SECURE:-true}
      MONITORING_SITE_URL: http://nginx
      MONITORING_SITE_HOST: ${APP_NAME}
      MONITORING_API_URL: http://127.0.0.1:8000
      MONITORING_REDIS_URL: redis://redis:6379/0
      MONITORING_TRAFFIC_LOG: /var/log/nginx/traffic.jsonl
      MONITORING_HOST_PROC: /host/proc
      MONITORING_DISK_PATH: /var/log/nginx
      DEPLOY_SMOKE_USERNAME: ${DEPLOY_SMOKE_USERNAME:-}
      DEPLOY_SMOKE_PASSWORD: ${DEPLOY_SMOKE_PASSWORD:-}
      DEPLOY_MIN_AVAILABLE_MIB: ${DEPLOY_MIN_AVAILABLE_MIB:-1024}
    expose:
      - "8000"
    volumes:
      - ./configs:/var/www/configs:ro
      - ./data/metrics:/var/www/data/metrics:ro
      - ./data/demo:/var/www/data/demo:ro
      - ./log/api:/var/www/log
      - ./log/nginx:/var/log/nginx:ro
      - /proc:/host/proc:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      prophet-api:
        condition: service_started
    networks:
      application:
      backend:
      observations:
      forecasts:
      impacts:

    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 30s
      start_interval: 1s
    stop_grace_period: 60s

  api-migrate:
    image: ${ARGUS_API_IMAGE:-ghcr.io/a-kryvenko/argus-forecast:latest}
    profiles: ["maintenance"]
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *api-db
    networks: [backend]

  db-provision:
    image: ${ARGUS_API_IMAGE:-ghcr.io/a-kryvenko/argus-forecast:latest}
    profiles: ["maintenance"]
    command: [".venv/bin/python", "/var/www/scripts/db/provision.py", "--apply"]
    environment:
      <<: [*admin-db, *api-db, *clio-db, *prophet-db, *intelligence-db]
    networks: [backend]

  frontend:
    image: ${ARGUS_FRONTEND_IMAGE:-ghcr.io/a-kryvenko/argus-frontend:latest}
    container_name: argusFrontend
    restart: unless-stopped
    tty: true
    expose:
      - "3000"
    environment:
      DEMO_BUNDLE_PATH: /var/www/demo/current.json
    volumes:
      - ./log/frontend:/var/www/log
      - ./data/demo:/var/www/demo:ro
    depends_on:
      - api
    networks:
      application:
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 30s
      start_interval: 1s
    stop_grace_period: 60s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      backend:
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      backend:
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:stable-alpine
    container_name: argusNginx
    restart: unless-stopped
    tty: true
    expose:
      - "80"
    volumes:
      - ./log/nginx:/var/www/log
      - ./nginx/default.conf:/etc/nginx/includes/default.conf
      - ./nginx/templates/http.conf.template:/etc/nginx/templates/website.conf.template
      - ./data/next-static:/var/www/next-static:ro
    environment:
      - HOSTNAME=${APP_NAME}
      - APP_NAME=${APP_NAME}
      - VIRTUAL_HOST=${APP_NAME}
      - LETSENCRYPT_HOST=${APP_NAME}
    depends_on:
      - frontend
      - api
    networks:
      nginx-proxy-network:
      frontserver:
      application:
          aliases:
            - ${APP_NAME}

  alloy:
    image: grafana/alloy:latest
    container_name: argusAlloy
    restart: unless-stopped
    tty: true
    environment:
      - LOKI_MONITORING_ENDPOINT=${LOKI_MONITORING_ENDPOINT}
      - PROMETHEUS_MONITORING_ENDPOINT=${PROMETHEUS_MONITORING_ENDPOINT}
      - MONITORING_AUTH_USER=${MONITORING_AUTH_USER}
      - MONITORING_AUTH_PASSWORD=${MONITORING_AUTH_PASSWORD}
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro

       # Host metrics
      - /:/host/root:ro,rslave
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro

      # Logs
      - ./log/nginx:/var/log/nginx:ro

    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345

    depends_on:
      - nginx

volumes:
  postgres_data:
  redis_data:

networks:
  nginx-proxy-network:
    external: true
  frontserver:
    driver: bridge
  application:
    driver: bridge
  backend:
    driver: bridge
  observations:
    driver: bridge
  forecasts:
    driver: bridge
  impacts:
    driver: bridge
