[project]
name = "forecast"
version = "0.3.0"
description = "Shared forecast contracts, snapshot calculation and verification for Argus Sunwatch"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2,<3",
  "common",
]

[project.optional-dependencies]
evaluation = ["scikit-learn>=1.5"]

[tool.setuptools.package-dir]
"" = "src"

[tool.uv.sources]
common = { path = "../common", editable = true }

[tool.uv.workspace]
members = []

[dependency-groups]
test = ["pytest>=8,<10", "pytest-xdist>=3,<4", "scikit-learn>=1.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
