[project]
name = "prophet"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "common",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.16,<2",
  "forecast>=0.3.0",
  "joblib>=1.5.3",
  "forecast-core[models]>=0.5.0",
  "httpx>=0.28,<1",
  "sentry-sdk>=2.61.1",
]

[project.scripts]
prophet = "prophet.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
common = { path = "../../packages/common", editable = true }
forecast = { path = "../../packages/forecast", editable = true }
forecast-core = { path = "../../packages/forecast-core", editable = true }

[tool.uv.workspace]
members = []

[tool.setuptools.package-data]
prophet = ["db/migrations/script.py.mako"]

[dependency-groups]
test = ["pytest>=8,<10", "pytest-xdist>=3,<4", "httpx>=0.28,<1", "httpx2"]
