project:
  name: argus-sunwatch

prophet:
  calculation_timeout_seconds: 540
  shutdown_grace_seconds: 570
  verification_days: 30

# Observation sources and historical horizons.
clio:
  retention:
    live_days: 6
    normalized_days: 60
  solar_wind_events:
    enabled: true
    lookback_days: 30
  sdo_images:
    enabled: true
    backfill_days: 45
  observations:
    gong:
      sources:
        live: [gong.live]
        historical: [gong.archive]
      backfill_days: 2
    bx:
      sources:
        live: [swpc.rtsw_mag]
        historical: [omni.hourly]
      backfill_days: 60
    by:
      sources:
        live: [swpc.rtsw_mag]
        historical: [omni.hourly]
      backfill_days: 60
    bz:
      sources:
        live: [swpc.rtsw_mag]
        historical: [omni.hourly]
      backfill_days: 60
    v:
      sources:
        live: [swpc.rtsw_plasma]
        historical: [omni.hourly, ace.plasma_hourly, soho.plasma_hourly]
      backfill_days: 60
    n:
      sources:
        live: [swpc.rtsw_plasma]
        historical: [omni.hourly, ace.plasma_hourly, soho.plasma_hourly]
      backfill_days: 60
    t:
      sources:
        live: [swpc.rtsw_plasma]
        historical: [omni.hourly, ace.plasma_hourly, soho.plasma_hourly]
      backfill_days: 60
    kp:
      sources:
        live: [swpc.kp]
        historical: [omni.hourly]
      backfill_days: 60
    ap:
      sources:
        live: [swpc.kp]
        historical: [omni.hourly]
      backfill_days: 60
    dst:
      sources:
        live: [swpc.dst]
        historical: [omni.hourly]
      backfill_days: 60
    f10_7:
      sources:
        live: [swpc.f107]
        historical: [gfz.f107, omni.hourly]
      backfill_days: 88
    goes:
      sources:
        live: [goes.live]
        historical: [goes.archive]
      backfill_days: 88
