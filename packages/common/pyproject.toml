[project]
name = "common"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>2.0.0",
    "pyyaml",
    "python-dotenv>=1.2.2",
    "pandas>=2.2"
]

[tool.setuptools.package-dir]
"" = "src"

[tool.uv.workspace]
members = []

[dependency-groups]
test = ["pytest>=8,<10", "pytest-xdist>=3,<4", "sentry-sdk"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
