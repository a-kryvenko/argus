models:
  cme_arrival:
    model: argus-cme-arrival-enlil-v1

  solar_event_speed:
    model: argus-cme-speed-v2
    sha256: 9eee53f8996b044f95d523ac79fc8ca6508a7c6d29ede2fe8d9b923526b48379
    integration:
      enabled: true
      version: cme-arrival-window-v2

  plasma_speed_dlinear:
    model: argus-plasma-speed-dlinear-v1
    artifact_path: data/models/argus-plasma-speed-dlinear-v1.joblib
    metrics: data/metrics/dlinear

  plasma_speed_quantile:
    model: argus-plasma-speed-aia-ridge-v1
    metrics: data/metrics/plasma/speed_quantile
    metrics_report: configs/evaluations/solar-wind-speed.json
  
  plasma_speed_threshold:
    model: argus-plasma-speed-aia-ridge-v1
    metrics: data/metrics/plasma/speed_proba

  plasma_density_quantile:
    model: argus-plasma-density-proswin-blend-v1
    artifact_path: data/models/argus-plasma-density-proswin-blend-v1.joblib
    metrics: data/metrics/plasma/density_proswin
    metrics_report: configs/evaluations/solar-wind-density.json

  plasma_temperature_quantile:
    model: argus-plasma-temperature-proswin-v1
    artifact_path: data/models/argus-plasma-temperature-proswin-v1.joblib
    metrics: data/metrics/plasma/temperature_proswin
    metrics_report: configs/evaluations/solar-wind-temperature.json

  kp_threshold:
    model: argus-kp-revalidated-2026-v1
    metrics: data/metrics/geomagnetic/kp_proba

  ap_quantile:
    model: argus-ap-revalidated-2026-v1
    metrics: data/metrics/geomagnetic/ap_revalidated_2026_v1

  dst_quantile:
    model: argus-dst-revalidated-2026-v1
    metrics: data/metrics/geomagnetic/dst_revalidated_2026_v1

  hmf_total_threshold:
    model: argus-bt-revalidated-2026-v2
    metrics: data/metrics/hmf/bt_revalidated_2026_v2
  
  hmf_southward_threshold:
    model: argus-bs-revalidated-2026-v2
    metrics: data/metrics/hmf/bs_revalidated_2026_v2

  f10_7_quantile:
    model: argus-f10_7-q-v1
    metrics: data/metrics/radiation/f10_7_quantile

  # GOES -> SOLFSMY observation calibration; not a forecast model.
  solar_index_calibration:
    model: argus-solar-indices-cal-v1
    calibration_path: data/models/argus-solar-indices-cal-v1.json
    metrics: data/metrics/radiation/solar_index_calibration
    goes_archive:
      cache_path: data/raw/goes/archive
      # First usable satellite wins at each minute. Never mix two rows per minute.
      satellites: [18, 16]
      url: https://data.ngdc.noaa.gov/platforms/solar-space-observing-satellites/goes/
    datasets:
      "2010_2024":
        role: train
        training_path: data/training/2010_2024
        solfsmy_path: data/raw/spacewx/solfsmy_2010_2024.parquet
        goes_path: data/raw/goes/goes_2010_2024.parquet
      "2025":
        role: validation
        training_path: data/training/2025
        solfsmy_path: data/raw/spacewx/solfsmy_2025.parquet
        goes_path: data/raw/goes/goes_2025.parquet
  
  s10_quantile:
    model: argus-s10-q-v1
    metrics: data/metrics/radiation/s10_quantile
  
  m10_quantile:
    model: argus-m10-q-v1
    metrics: data/metrics/radiation/m10_quantile
  
  y10_quantile:
    model: argus-y10-q-v1
    metrics: data/metrics/radiation/y10_quantile

  dtc:
    active_versions: null
    metrics: data/metrics/dtc

  atmospheric_density:
    # Switch to DTM2020 after a suitable CNES license and runtime provisioning.
    model: JB2008
    runtime_path: data/models/dtm2020
    history_cache: data/observations/jb2008
    max_age_hours: 6
    active_versions: null
    metrics: data/metrics/atmospheric-density
