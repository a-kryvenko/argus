[project]
name = "argus-intelligence"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["common", "httpx>=0.28,<1"]

[project.scripts]
intelligence = "argus_intelligence.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
common = { workspace = true, editable = true }

[tool.uv.workspace]
members = ["../../packages/common"]
