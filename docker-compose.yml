# Python images use the production Dockerfiles; source mounts keep edits live.
# Set LOCAL_UID/LOCAL_GID if your Linux user is not 1000:1000.
name: argus-sunwatch-dev

x-admin-db: &admin-db
  DB_HOST: postgres
  DB_PORT: '5432'
  DB_NAME: ${DB_NAME:?DB_NAME is required}
  DB_USER: ${DB_USER:?DB_USER is required}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}

x-api-db: &api-db
  API_DB_HOST: postgres
  API_DB_PORT: '5432'
  API_DB_NAME: ${API_DB_NAME:?API_DB_NAME is required}
  API_DB_USER: ${API_DB_USER:?API_DB_USER is required}
  API_DB_PASSWORD: ${API_DB_PASSWORD:?API_DB_PASSWORD is required}

x-clio-db: &clio-db
  CLIO_DB_HOST: postgres
  CLIO_DB_PORT: '5432'
  CLIO_DB_NAME: ${CLIO_DB_NAME:?CLIO_DB_NAME is required}
  CLIO_DB_USER: ${CLIO_DB_USER:?CLIO_DB_USER is required}
  CLIO_DB_PASSWORD: ${CLIO_DB_PASSWORD:?CLIO_DB_PASSWORD is required}

x-prophet-db: &prophet-db
  PROPHET_DB_HOST: postgres
  PROPHET_DB_PORT: '5432'
  PROPHET_DB_NAME: ${PROPHET_DB_NAME:?PROPHET_DB_NAME is required}
  PROPHET_DB_USER: ${PROPHET_DB_USER:?PROPHET_DB_USER is required}
  PROPHET_DB_PASSWORD: ${PROPHET_DB_PASSWORD:?PROPHET_DB_PASSWORD is required}

x-intelligence-db: &intelligence-db
  INTELLIGENCE_DB_HOST: postgres
  INTELLIGENCE_DB_PORT: '5432'
  INTELLIGENCE_DB_NAME: ${INTELLIGENCE_DB_NAME:?INTELLIGENCE_DB_NAME is required}
  INTELLIGENCE_DB_USER: ${INTELLIGENCE_DB_USER:?INTELLIGENCE_DB_USER is required}
  INTELLIGENCE_DB_PASSWORD: ${INTELLIGENCE_DB_PASSWORD:?INTELLIGENCE_DB_PASSWORD is required}

x-clio-runtime: &clio-runtime
  build:
    context: .
    dockerfile: .deploy/clio.Dockerfile
  image: argus-clio-dev
  init: true
  user: ${LOCAL_UID:-1000}:${LOCAL_GID:-1000}
  volumes:
    - ./configs:/var/www/configs:ro
    - ./data/observations:/var/www/data/observations
    - ./apps/clio/src:/var/www/apps/clio/src
    - ./packages/common/src:/var/www/packages/common/src
  stop_grace_period: 10m
  depends_on:
    postgres:
      condition: service_healthy
  environment:
    ARGUS_WORKDIR: /var/www
    # Scientific libraries need writable config/cache paths for arbitrary UIDs.
    XDG_CONFIG_HOME: /tmp/clio-config
    XDG_CACHE_HOME: /tmp/clio-cache
    DEBUG: ${DEBUG:-false}
    <<: *clio-db
    OBSERVATIONS_SERVICE_TOKEN: ${OBSERVATIONS_SERVICE_TOKEN:?OBSERVATIONS_SERVICE_TOKEN is required}
    SDO_EMAIL: ${SDO_EMAIL:-}
    SENTRY_COLLECT_POINT: ${SENTRY_COLLECT_POINT:-}

x-prophet-runtime: &prophet-runtime
  build:
    context: .
    dockerfile: .deploy/prophet.Dockerfile
  image: argus-prophet-dev
  init: true
  user: ${LOCAL_UID:-1000}:${LOCAL_GID:-1000}
  volumes:
    - ./configs:/var/www/configs:ro
    - ./apps/prophet/src:/var/www/apps/prophet/src
    - ./packages/common/src:/var/www/packages/common/src
    - ./packages/forecast/src:/var/www/packages/forecast/src
    - ./packages/forecast-core/src:/var/www/packages/forecast-core/src
  depends_on:
    postgres:
      condition: service_healthy
  environment: &prophet-env
    ARGUS_WORKDIR: /var/www
    <<: *prophet-db

x-intelligence-runtime: &intelligence-runtime
  build:
    context: .
    dockerfile: .deploy/intelligence.Dockerfile
  image: argus-intelligence-dev
  init: true
  user: ${LOCAL_UID:-1000}:${LOCAL_GID:-1000}
  volumes:
    - ./configs:/var/www/configs:ro
    - ./apps/intelligence/src:/var/www/apps/intelligence/src
    - ./packages/common/src:/var/www/packages/common/src
    - ./packages/intelligence-core/src:/var/www/packages/intelligence-core/src
  depends_on:
    postgres:
      condition: service_healthy
    prophet-api:
      condition: service_started
  environment: &intelligence-env
    <<: *intelligence-db
    FORECASTS_URL: http://prophet-api:8000
    FORECASTS_SERVICE_TOKEN: ${FORECASTS_SERVICE_TOKEN:?FORECASTS_SERVICE_TOKEN is required}
    ARGUS_WORKDIR: /var/www

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - 127.0.0.1:6379:6379
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  clio:
    <<: *clio-runtime
    command: [".venv/bin/uvicorn", "clio.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "src", "--reload-dir", "/var/www/packages"]
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    ports:
      - 127.0.0.1:8001:8000

  clio-worker:
    <<: *clio-runtime
    command: ["clio", "worker"]
    healthcheck:
      test: ["CMD", "clio", "check-health", "worker"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

  prophet:
    <<: *prophet-runtime
    environment:
      <<: *prophet-env
      OBSERVATIONS_URL: http://clio:8000
      OBSERVATIONS_SERVICE_TOKEN: ${OBSERVATIONS_SERVICE_TOKEN:?OBSERVATIONS_SERVICE_TOKEN is required}
      SENTRY_COLLECT_POINT: ${SENTRY_COLLECT_POINT:-}
    volumes:
      - ./configs:/var/www/configs:ro
      - ./data/models:/var/www/data/models:ro
      - ./data/prophet:/var/www/data/prophet
      - ./data/demo:/var/www/data/demo
      - ./apps/prophet/src:/var/www/apps/prophet/src
      - ./packages/common/src:/var/www/packages/common/src
      - ./packages/forecast/src:/var/www/packages/forecast/src
      - ./packages/forecast-core/src:/var/www/packages/forecast-core/src
    command: ["prophet", "worker"]
    stop_grace_period: 10m
    depends_on:
      postgres:
        condition: service_healthy
      clio:
        condition: service_started
  
  prophet-api:
    <<: *prophet-runtime
    environment:
      <<: *prophet-env
      FORECASTS_SERVICE_TOKEN: ${FORECASTS_SERVICE_TOKEN:?FORECASTS_SERVICE_TOKEN is required}
    command: [".venv/bin/uvicorn", "prophet.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "src", "--reload-dir", "/var/www/packages"]
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=15)"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s
    ports:
      - 127.0.0.1:8002:8000

  proswin:
    build:
      context: .
      dockerfile: .deploy/proswin.Dockerfile
    image: argus-proswin-dev
    user: ${LOCAL_UID:-1000}:${LOCAL_GID:-1000}
    command: ["python", "-m", "prophet.services.proswin.queue"]
    mem_limit: 1536m
    memswap_limit: 1536m
    restart: unless-stopped
    init: true
    environment:
      XDG_CACHE_HOME: /tmp/proswin-cache
      TORCHINDUCTOR_CACHE_DIR: /tmp/torchinductor
      SUNPY_DOWNLOADDIR: /tmp/sunpy-downloads
      ARGUS_WORKDIR: /var/www
      OBSERVATIONS_URL: http://clio:8000
      OBSERVATIONS_SERVICE_TOKEN: ${OBSERVATIONS_SERVICE_TOKEN:-}
    volumes:
      - ./configs:/var/www/configs:ro
      - ./data/models:/var/www/data/models:ro
      - ./data/prophet:/var/www/data/prophet
      - ./apps/prophet/src:/var/www/apps/prophet/src
      - ./packages/common/src:/var/www/packages/common/src
      - ./packages/forecast/src:/var/www/packages/forecast/src
      - ./packages/forecast-core/src/forecast_core/models/proswin.py:/var/www/packages/forecast-core/src/forecast_core/models/proswin.py:ro
    depends_on:
      clio:
        condition: service_started

  intelligence:
    <<: *intelligence-runtime
    environment:
      <<: *intelligence-env
      INTELLIGENCE_EXPERIMENTAL_DRAG_MONITOR: ${INTELLIGENCE_EXPERIMENTAL_DRAG_MONITOR:-false}
    command: ["intelligence", "worker"]
    stop_grace_period: 2m

  intelligence-api:
    <<: *intelligence-runtime
    environment:
      <<: *intelligence-env
      INTELLIGENCE_SERVICE_TOKEN: ${INTELLIGENCE_SERVICE_TOKEN:?INTELLIGENCE_SERVICE_TOKEN is required}
    command: ["intelligence", "serve"]
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 30s

  api:
    build: &api-build
      context: .
      dockerfile: .deploy/api.Dockerfile
    image: argus-api-dev
    init: true
    user: ${LOCAL_UID:-1000}:${LOCAL_GID:-1000}
    environment:
      ARGUS_WORKDIR: /var/www
      DEBUG: ${DEBUG:-false}
      <<: *api-db
      SENTRY_COLLECT_POINT: ${SENTRY_COLLECT_POINT:-}
      INTELLIGENCE_URL: http://intelligence-api:8000
      INTELLIGENCE_SERVICE_TOKEN: ${INTELLIGENCE_SERVICE_TOKEN:?INTELLIGENCE_SERVICE_TOKEN is required}
      FORECASTS_URL: http://prophet-api:8000
      FORECASTS_SERVICE_TOKEN: ${FORECASTS_SERVICE_TOKEN:?FORECASTS_SERVICE_TOKEN is required}
      OBSERVATIONS_URL: http://clio:8000
      OBSERVATIONS_SERVICE_TOKEN: ${OBSERVATIONS_SERVICE_TOKEN:?OBSERVATIONS_SERVICE_TOKEN is required}
      DASHBOARD_ORIGINS: ${DASHBOARD_ORIGINS:-http://localhost:3000}
      DASHBOARD_COOKIE_SECURE: ${DASHBOARD_COOKIE_SECURE:-false}
      MONITORING_REDIS_URL: redis://redis:6379/0
    volumes: &api-volumes
      - ./configs:/var/www/configs:ro
      - ./data/metrics:/var/www/data/metrics:ro
      - ./data/demo:/var/www/data/demo:ro
      - ./apps/api/src:/var/www/apps/api/src
      - ./scripts/db/provision.py:/var/www/scripts/db/provision.py:ro
      - ./packages/common/src:/var/www/packages/common/src
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      prophet-api:
        condition: service_started
    command: [".venv/bin/uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "src", "--reload-dir", "/var/www/packages"]
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ping', timeout=5)"]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 30s
    ports:
      - 127.0.0.1:8000:8000

  db-provision:
    build: *api-build
    image: argus-api-dev
    init: true
    user: ${LOCAL_UID:-1000}:${LOCAL_GID:-1000}
    environment:
      <<: [*admin-db, *api-db, *clio-db, *prophet-db, *intelligence-db]
      ARGUS_WORKDIR: /var/www
    volumes: *api-volumes
    command: [".venv/bin/python", "/var/www/scripts/db/provision.py", "--apply"]
    profiles: ["maintenance"]


volumes:
  postgres_data:
  redis_data:
