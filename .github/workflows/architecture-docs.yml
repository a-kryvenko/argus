name: Architecture diagrams

on:
  pull_request:
    paths:
      - docs/architecture/**
      - scripts/build-architecture
      - scripts/architecture-tools.json
      - package.json
      - .github/workflows/architecture-docs.yml
  push:
    branches: [master]
    paths:
      - docs/architecture/**
      - scripts/build-architecture
      - scripts/architecture-tools.json
      - package.json
      - .github/workflows/architecture-docs.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: vendor/architecture-tools
          key: architecture-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/architecture-tools.json') }}
      - name: Rebuild and compare committed C4 diagrams
        run: python3 scripts/build-architecture --check
