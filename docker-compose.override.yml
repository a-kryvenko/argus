# Development: local builds, source mounts and reload.
name: argus-sunwatch-dev

x-object-storage: &object-storage
  S3_ENDPOINT_URL: http://storage:8333
  S3_REGION: us-east-1

x-object-reader: &object-reader
  <<: *object-storage
  S3_ACCESS_KEY_ID: argus-dev-reader
  S3_SECRET_ACCESS_KEY: argus-dev-reader-secret

x-clio-runtime: &clio-runtime
  build: &clio-build
    context: .
    dockerfile: .deploy/clio.Dockerfile
  image: argus-clio-dev
  user: ${LOCAL_UID:-1000}:${LOCAL_GID:-1000}
  volumes:
    - ./apps/clio/src:/var/www/apps/clio/src
    - ./packages/common/src:/var/www/packages/common/src
  depends_on:
    storage:
      condition: service_healthy
  environment: &clio-environment
    <<: *object-storage
    CLIO_DB_HOST: postgres
    CLIO_DB_PORT: '5432'
    XDG_CONFIG_HOME: /tmp/clio-config
    XDG_CACHE_HOME: /tmp/clio-cache
    SDO_EMAIL: ${SDO_EMAIL:-}
    S3_ACCESS_KEY_ID: argus-dev-writer
    S3_SECRET_ACCESS_KEY: argus-dev-writer-secret
    S3_PUBLIC_BASE_URL: ${DEV_S3_PUBLIC_BASE_URL:-http://localhost:${DEV_S3_PORT:-8333}/argus-public}

x-prophet-runtime: &prophet-runtime
  build: &prophet-build
    context: .
    dockerfile: .deploy/prophet.Dockerfile
  image: argus-prophet-dev
  user: ${LOCAL_UID:-1000}:${LOCAL_GID:-1000}
  volumes:
    - ./apps/prophet/src:/var/www/apps/prophet/src
    - ./packages/common/src:/var/www/packages/common/src
    - ./packages/forecast/src:/var/www/packages/forecast/src
    - ./packages/forecast-core/src:/var/www/packages/forecast-core/src
  environment: &prophet-environment
    <<: *object-reader
    PROPHET_DB_HOST: postgres
    PROPHET_DB_PORT: '5432'
  depends_on:
    storage:
      condition: service_healthy

x-intelligence-runtime: &intelligence-runtime
  build: &intelligence-build
    context: .
    dockerfile: .deploy/intelligence.Dockerfile
  image: argus-intelligence-dev
  user: ${LOCAL_UID:-1000}:${LOCAL_GID:-1000}
  volumes:
    - ./apps/intelligence/src:/var/www/apps/intelligence/src
    - ./packages/common/src:/var/www/packages/common/src
    - ./packages/intelligence-core/src:/var/www/packages/intelligence-core/src
  environment: &intelligence-environment
    INTELLIGENCE_DB_HOST: postgres
    INTELLIGENCE_DB_PORT: '5432'
    FORECASTS_URL: http://prophet-api:8000

x-api-runtime: &api-runtime
  build: &api-build
    context: .
    dockerfile: .deploy/api.Dockerfile
  image: argus-api-dev
  user: ${LOCAL_UID:-1000}:${LOCAL_GID:-1000}
  environment: &api-environment
    API_DB_HOST: postgres
    API_DB_PORT: '5432'
    INTELLIGENCE_URL: http://intelligence-api:8000
    FORECASTS_URL: http://prophet-api:8000
    OBSERVATIONS_URL: http://clio:8000
    DASHBOARD_ORIGINS: ${DASHBOARD_ORIGINS:-http://localhost:3000}
    DASHBOARD_COOKIE_SECURE: ${DASHBOARD_COOKIE_SECURE:-false}
  volumes:
    - ./apps/api/src:/var/www/apps/api/src
    - ./scripts/db/provision.py:/var/www/scripts/db/provision.py:ro
    - ./packages/common/src:/var/www/packages/common/src

services:
  storage:
    image: chrislusf/seaweedfs:4.52
    entrypoint: [weed]
    command: [mini, -dir=/data, -ip=storage, -ip.bind=0.0.0.0, -s3.config=/etc/seaweedfs/s3.json, '-bucket=argus-private,argus-public']
    restart: unless-stopped
    volumes:
      - seaweed-data:/data
      - ./.deploy/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    ports:
      - 127.0.0.1:${DEV_S3_PORT:-8333}:8333
    healthcheck:
      test: [CMD, nc, -z, 127.0.0.1, '8333']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  postgres:
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

  redis:
    ports:
      - 127.0.0.1:6379:6379

  clio:
    <<: *clio-runtime
    command: [.venv/bin/uvicorn, 'clio.main:app', --host, 0.0.0.0, --port, '8000', --reload, --reload-dir, src, --reload-dir, /var/www/packages]
    ports:
      - 127.0.0.1:8001:8000

  clio-worker:
    <<: *clio-runtime

  prophet:
    <<: *prophet-runtime
    environment:
      <<: *prophet-environment
      OBSERVATIONS_URL: http://clio:8000

  prophet-api:
    <<: *prophet-runtime
    command: [.venv/bin/uvicorn, 'prophet.main:app', --host, 0.0.0.0, --port, '8000', --reload, --reload-dir, src, --reload-dir, /var/www/packages]
    ports:
      - 127.0.0.1:8002:8000

  proswin:
    build:
      context: .
      dockerfile: .deploy/proswin.Dockerfile
    image: argus-proswin-dev
    user: ${LOCAL_UID:-1000}:${LOCAL_GID:-1000}
    environment:
      <<: *object-reader
      XDG_CACHE_HOME: /tmp/proswin-cache
      TORCHINDUCTOR_CACHE_DIR: /tmp/torchinductor
      SUNPY_DOWNLOADDIR: /tmp/sunpy-downloads
      OBSERVATIONS_URL: http://clio:8000
      OBSERVATIONS_SERVICE_TOKEN: ${OBSERVATIONS_SERVICE_TOKEN:-}
    depends_on:
      storage:
        condition: service_healthy
    volumes:
      - ./apps/prophet/src:/var/www/apps/prophet/src
      - ./packages/common/src:/var/www/packages/common/src

      - ./packages/forecast/src:/var/www/packages/forecast/src
      - ./packages/forecast-core/src/forecast_core/models/proswin.py:/var/www/packages/forecast-core/src/forecast_core/models/proswin.py:ro

  intelligence:
    <<: *intelligence-runtime

  intelligence-api:
    <<: *intelligence-runtime

  api:
    <<: *api-runtime
    init: true
    command: [.venv/bin/uvicorn, 'api.main:app', --host, 0.0.0.0, --port, '8000', --reload, --reload-dir, src, --reload-dir, /var/www/packages]
    healthcheck:
      retries: 5
    ports:
      - 127.0.0.1:8000:8000

  db-provision:
    build:
      context: .
      dockerfile: .deploy/api.Dockerfile
    image: argus-api-dev
    init: true
    user: ${LOCAL_UID:-1000}:${LOCAL_GID:-1000}
    environment:
      INTELLIGENCE_DB_HOST: postgres
      INTELLIGENCE_DB_PORT: '5432'
      PROPHET_DB_HOST: postgres
      PROPHET_DB_PORT: '5432'
      CLIO_DB_HOST: postgres
      CLIO_DB_PORT: '5432'
      API_DB_HOST: postgres
      API_DB_PORT: '5432'
      DB_HOST: postgres
      DB_PORT: '5432'
      ARGUS_WORKDIR: /var/www
    volumes:
      - ./configs:/var/www/configs:ro
      - ./data/metrics:/var/www/data/metrics:ro
      - ./data/demo:/var/www/data/demo:ro
      - ./apps/api/src:/var/www/apps/api/src
      - ./scripts/db/provision.py:/var/www/scripts/db/provision.py:ro
      - ./packages/common/src:/var/www/packages/common/src

volumes:
  seaweed-data:
