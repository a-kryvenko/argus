name: Package architecture
on:
  pull_request:
    branches: [master]
concurrency:
  group: architecture-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/workflows/architecture.yml
      - name: Install test dependencies
        run: python -m pip install pytest pyyaml
      - name: Check package boundaries and service dependencies
        run: python -m pytest -q tests/architecture/test_boundaries.py tests/architecture/test_isolation.py
      - name: Check login throttling through nginx
        env:
          TEST_NGINX_IMAGE: nginx:stable-alpine
        run: python -m pytest -q tests/integration/test_login_edge.py
