name: Application Deploy

on:
  push:
    tags:
      - "v*"

jobs:
  push_to_registry:
    name: Build And Push Docker images to Docker Hub
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract frontend metadata (tags, labels) for Docker
        id: metaFrontend
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: andriykryvenko/argus-frontend

      - name: Build and push Frontend Docker image
        id: pushFrontend
        uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671
        with:
          context: .
          file: ./.deploy/frontend.Dockerfile
          push: true
          tags: ${{ steps.metaFrontend.outputs.tags }}
          labels: ${{ steps.metaFrontend.outputs.labels }}

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-name: index.docker.io/andriykryvenko/argus-frontend
          subject-digest: ${{ steps.pushFrontend.outputs.digest }}
          push-to-registry: true
      
      - name: Extract api metadata (tags, labels) for Docker
        id: metaApi
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: andriykryvenko/argus-forecast

      - name: Check out private forecast backend
        uses: actions/checkout@v6
        with:
          repository: a-kryvenko/argus-forecast-core
          ref: master
          path: packages/forecast-core
          ssh-key: ${{ secrets.FORECAST_CORE_DEPLOY_KEY }}
          persist-credentials: false

      - name: Build and push Public Api Docker image
        id: pushApi
        uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671
        with:
          context: .
          file: ./.deploy/api.Dockerfile
          push: true
          tags: ${{ steps.metaApi.outputs.tags }}
          labels: ${{ steps.metaApi.outputs.labels }}

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-name: index.docker.io/andriykryvenko/argus-forecast
          subject-digest: ${{ steps.pushApi.outputs.digest }}
          push-to-registry: true

      - name: Extract Prophet metadata
        id: metaProphet
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: andriykryvenko/argus-prophet

      - name: Build and push Prophet image
        id: pushProphet
        uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671
        with:
          context: .
          file: ./.deploy/prophet.Dockerfile
          push: true
          tags: ${{ steps.metaProphet.outputs.tags }}
          labels: ${{ steps.metaProphet.outputs.labels }}

      - name: Attest Prophet image
        uses: actions/attest@v4
        with:
          subject-name: index.docker.io/andriykryvenko/argus-prophet
          subject-digest: ${{ steps.pushProphet.outputs.digest }}
          push-to-registry: true

      - name: Extract Clio metadata
        id: metaClio
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: andriykryvenko/argus-clio

      - name: Build and push Clio image
        id: pushClio
        uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671
        with:
          context: .
          file: ./.deploy/clio.Dockerfile
          push: true
          tags: ${{ steps.metaClio.outputs.tags }}
          labels: ${{ steps.metaClio.outputs.labels }}

      - name: Attest Clio image
        uses: actions/attest@v4
        with:
          subject-name: index.docker.io/andriykryvenko/argus-clio
          subject-digest: ${{ steps.pushClio.outputs.digest }}
          push-to-registry: true

  upload_code:
    needs: push_to_registry
    name: Upload code to production server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Upload compose/files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          source: ".deploy/docker-compose.yml,.deploy/cronjobs.txt,.deploy/nginx,.deploy/alloy,.deploy/nginx-proxy-up.sh,configs"
          target: "/var/www"
      
      
      - name: Restart production containers
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOCKERHUB_LOGIN: ${{ secrets.DOCKERHUB_LOGIN }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          envs: DOCKERHUB_LOGIN,DOCKERHUB_TOKEN
          script: |
            set -eu

            cd /var/www
            export COMPOSE_ENV_FILES=.env,.env.local
            docker compose --project-directory /var/www -f .deploy/docker-compose.yml config --quiet
            mkdir -p log/nginx log/frontend log/api data models metrics nginx nginx/templates alloy configs
            mv ./.deploy/docker-compose.yml ./
            mv ./.deploy/nginx-proxy-up.sh ./
            mv ./.deploy/nginx/default.conf ./nginx/
            mv ./.deploy/nginx/templates/http.conf.template ./nginx/templates/
            mv ./.deploy/alloy/config.alloy ./alloy/
            mv ./.deploy/cronjobs.txt ./
            rm -rf ./.deploy

            crontab cronjobs.txt
            rm cronjobs.txt

            echo "$DOCKERHUB_TOKEN" | docker login \
              --username "$DOCKERHUB_LOGIN" \
              --password-stdin
            
            docker compose --profile maintenance pull
            docker compose up -d postgres redis

            # Stop current service writers before backup and migrations.
            # Finish independent manual jobs before starting a deployment.
            docker compose stop api solar-wind geomagnetic prophet prophet-api clio clio-refresh clio-aggregate
            mkdir -p backups
            backup_file="backups/pre-deploy-$(date -u +%Y%m%dT%H%M%SZ).dump"
            docker compose exec -T postgres sh -c 'pg_dump --username="$POSTGRES_USER" --dbname="$POSTGRES_DB" --format=custom' > "$backup_file"

            docker compose run --rm db-bootstrap
            docker compose run --rm clio-migrate
            docker compose run --rm api-migrate
            docker compose run --rm prophet-migrate
            docker compose up -d --remove-orphans
            docker image prune -f

            # Clio and Prophet schedule and retry their own work.
