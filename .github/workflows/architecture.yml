name: Package architecture
on: [push, pull_request]
jobs:
  public-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install public packages only
        run: python -m pip install -e packages/common -e packages/forecast pytest
      - name: Check boundaries and public imports
        run: python -m pytest tests packages/forecast/tests
